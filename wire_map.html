<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wire Map</title>
<style>
:root{
  --bg:#020a04; --line:#21ff6b; --minor:#0f7a35; --accent:#ffe14a; --text:#9dffbd; --grid:#06240f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--minor)}
#title{font-size:15px;letter-spacing:.25em;color:var(--line);text-shadow:0 0 8px var(--line);white-space:nowrap}
#status{font-size:10px;letter-spacing:.1em;opacity:.8;text-align:right;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapwrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--minor)}
button{flex:1;background:transparent;color:var(--line);border:1px solid var(--line);
  font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  padding:12px 6px;border-radius:2px;cursor:pointer;text-shadow:0 0 6px var(--line);
  box-shadow:0 0 8px rgba(0,0,0,.4) inset}
button:active{background:var(--line);color:var(--bg);text-shadow:none}
#ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--minor);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));font-size:12px;
  letter-spacing:.08em;color:var(--accent);background:rgba(0,0,0,.35)}
#tickInner{display:inline-block;padding-left:100%;animation:scroll 40s linear infinite;will-change:transform}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.corner{position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none}
.tl{top:6px;left:6px;border-right:0;border-bottom:0}.tr{top:6px;right:6px;border-left:0;border-bottom:0}
.bl{bottom:6px;left:6px;border-right:0;border-top:0}.br{bottom:6px;right:6px;border-left:0;border-top:0}
#legend{position:absolute;left:12px;bottom:12px;font-size:10px;letter-spacing:.12em;opacity:.8;
  text-shadow:0 0 4px #000;pointer-events:none;line-height:1.5}
@media (orientation:landscape) and (max-height:480px){
  #top{padding-top:4px;padding-bottom:4px}
  button{padding:8px 6px}
  #bar{padding:5px 10px}
  #ticker{padding-top:4px;padding-bottom:4px}
}
/* fullscreen-ish mode: hide chrome except exit button */
body.full #top, body.full #ticker{display:none}
body.full #bar{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top));left:auto;
  border:0;padding:0;background:transparent;z-index:5}
body.full #bar button:not(#btnFull){display:none}
body.full #btnFull{background:rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">WIRE MAP</div>
    <div id="status">LOCATING…</div>
  </div>
  <div id="mapwrap">
    <canvas id="cv"></canvas>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="legend"></div>
  </div>
  <div id="bar">
    <button id="btnColor">Colour</button>
    <button id="btnLoc">Locate</button>
    <button id="btnFull">Full</button>
  </div>
  <div id="ticker"><span id="tickInner">LOADING WEATHER…</span></div>
</div>

<script>
(function(){
"use strict";

/* ---------- palettes ---------- */
const PALETTES=[
 {n:"TERMINAL", bg:"#020a04", line:"#21ff6b", minor:"#0f7a35", accent:"#ffe14a", text:"#9dffbd", grid:"#06240f"},
 {n:"AMBER",    bg:"#0a0602", line:"#ff8a1c", minor:"#8a4a0c", accent:"#25e7ff", text:"#ffd19a", grid:"#2a1604"},
 {n:"NEON",     bg:"#06020f", line:"#ff2bd6", minor:"#5b1a8a", accent:"#25e7ff", text:"#ffb3f0", grid:"#1a0a33"},
 {n:"ICE",      bg:"#020812", line:"#3dd5ff", minor:"#16587a", accent:"#ffffff", text:"#bfeaff", grid:"#06203a"},
 {n:"TOXIC",    bg:"#050a00", line:"#c6ff00", minor:"#5a7a00", accent:"#ff3d3d", text:"#e6ffa0", grid:"#1a2800"},
 {n:"BLOOD",    bg:"#0a0203", line:"#ff3b3b", minor:"#7a1515", accent:"#ffd24a", text:"#ffb3b3", grid:"#2a0808"}
];
let pi=+(localStorage.getItem("wm_pal")||0)%PALETTES.length;
function applyPalette(){
  const p=PALETTES[pi],r=document.documentElement.style;
  r.setProperty("--bg",p.bg);r.setProperty("--line",p.line);r.setProperty("--minor",p.minor);
  r.setProperty("--accent",p.accent);r.setProperty("--text",p.text);r.setProperty("--grid",p.grid);
  try{localStorage.setItem("wm_pal",pi)}catch(e){}
  draw();
}

/* ---------- state ---------- */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const statusEl=document.getElementById("status"),tick=document.getElementById("tickInner");
const legend=document.getElementById("legend");
let pos={lat:-37.8800,lon:147.9800,real:false,label:"LAKES ENTRANCE (DEFAULT)"};
let roads=[];          // {cls, pts:[[lat,lon],...]}
let heading=0;
let radiusM=2500;      // map radius in metres (pinch/double tap to change)
let W=0,H=0,dpr=1;

function setStatus(t){statusEl.textContent=t}

/* ---------- projection ---------- */
function proj(lat,lon){
  const mPerLat=111320, mPerLon=111320*Math.cos(pos.lat*Math.PI/180);
  const dx=(lon-pos.lon)*mPerLon, dy=(lat-pos.lat)*mPerLat;
  const scale=Math.min(W,H)/2/radiusM;
  return [W/2+dx*scale, H/2-dy*scale];
}

/* ---------- drawing ---------- */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function resize(){
  const r=cv.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
const CLS={
  motorway:{w:3.2,main:true},trunk:{w:3,main:true},primary:{w:2.6,main:true},
  secondary:{w:2,main:true},tertiary:{w:1.4,main:false},residential:{w:.8,main:false},
  unclassified:{w:.8,main:false},other:{w:.6,main:false}
};
function draw(){
  if(!W)return;
  const line=css("--line"),minor=css("--minor"),accent=css("--accent"),grid=css("--grid"),bg=css("--bg");
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // grid
  const step=Math.max(28,Math.min(W,H)/12);
  ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=(W/2)%step;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=(H/2)%step;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();

  // range rings
  ctx.strokeStyle=minor;ctx.setLineDash([3,6]);ctx.lineWidth=1;
  const R=Math.min(W,H)/2;
  for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(W/2,H/2,R*i/3,0,Math.PI*2);ctx.stroke()}
  ctx.setLineDash([]);

  // roads: minor first, then main with glow
  ctx.lineCap="round";ctx.lineJoin="round";
  for(const pass of [0,1]){
    for(const rd of roads){
      const c=CLS[rd.cls]||CLS.other;
      if((pass===1)!==c.main)continue;
      ctx.beginPath();
      for(let i=0;i<rd.pts.length;i++){
        const [x,y]=proj(rd.pts[i][0],rd.pts[i][1]);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.strokeStyle=c.main?line:minor;
      ctx.lineWidth=c.w;
      if(c.main){ctx.shadowColor=line;ctx.shadowBlur=8}else{ctx.shadowBlur=0}
      ctx.stroke();
    }
  }
  ctx.shadowBlur=0;

  // road names on main roads
  ctx.fillStyle=accent;ctx.font="10px ui-monospace,Menlo,monospace";ctx.textBaseline="middle";
  const drawn=new Set();
  for(const rd of roads){
    if(!rd.name||!(CLS[rd.cls]||{}).main||drawn.has(rd.name))continue;
    const m=rd.pts[Math.floor(rd.pts.length/2)];
    const [x,y]=proj(m[0],m[1]);
    if(x<10||y<10||x>W-60||y>H-10)continue;
    drawn.add(rd.name);
    ctx.fillText(rd.name.toUpperCase(),x+5,y-5);
  }

  // user marker
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(heading*Math.PI/180);
  ctx.strokeStyle=accent;ctx.fillStyle=accent;ctx.lineWidth=2;ctx.shadowColor=accent;ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(8,9);ctx.lineTo(0,4);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.save();ctx.strokeStyle=accent;ctx.globalAlpha=.5;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(W/2,H/2,16+4*Math.sin(Date.now()/400),0,Math.PI*2);ctx.stroke();ctx.restore();

  legend.innerHTML=PALETTES[pi].n+" · "+(radiusM>=1000?(radiusM/1000).toFixed(1)+" KM":radiusM+" M")+" RADIUS<br>"
    +pos.lat.toFixed(4)+", "+pos.lon.toFixed(4)+(pos.real?"":" · DEFAULT");
}

/* gentle pulse redraw */
let pulse=setInterval(()=>{if(!document.hidden)draw()},500);

/* ---------- roads (OpenStreetMap via Overpass) ---------- */
const OVERPASS=[
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];
async function loadRoads(){
  setStatus("LOADING ROADS…");
  const r=Math.round(radiusM*1.15);
  const q=`[out:json][timeout:25];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)$"](around:${r},${pos.lat},${pos.lon}););out geom tags;`;
  const key="wm_roads_"+pos.lat.toFixed(2)+"_"+pos.lon.toFixed(2)+"_"+radiusM;
  for(const url of OVERPASS){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),20000);
      const res=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),signal:ctl.signal,
        headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      clearTimeout(to);
      if(!res.ok)throw new Error(res.status);
      const j=await res.json();
      roads=(j.elements||[]).filter(e=>e.geometry).map(e=>({
        cls:CLS[e.tags.highway]?e.tags.highway:"other",
        name:e.tags.name||e.tags.ref||"",
        pts:e.geometry.map(g=>[g.lat,g.lon])
      }));
      try{localStorage.setItem(key,JSON.stringify(roads))}catch(e){}
      setStatus((pos.real?"GPS LOCK":"DEFAULT LOCATION")+" · "+roads.length+" ROAD SEGMENTS");
      draw();return;
    }catch(e){/* try next mirror */}
  }
  // offline cache fallback
  try{
    const c=localStorage.getItem(key);
    if(c){roads=JSON.parse(c);setStatus("OFFLINE · CACHED MAP");draw();return}
  }catch(e){}
  roads=[];setStatus("ROAD DATA UNAVAILABLE · TAP LOCATE TO RETRY");draw();
}

/* ---------- weather (Open-Meteo, no key) ---------- */
const WCODE={0:"CLEAR",1:"MAINLY CLEAR",2:"PARTLY CLOUDY",3:"OVERCAST",45:"FOG",48:"RIME FOG",
 51:"LIGHT DRIZZLE",53:"DRIZZLE",55:"HEAVY DRIZZLE",56:"FREEZING DRIZZLE",57:"FREEZING DRIZZLE",
 61:"LIGHT RAIN",63:"RAIN",65:"HEAVY RAIN",66:"FREEZING RAIN",67:"FREEZING RAIN",
 71:"LIGHT SNOW",73:"SNOW",75:"HEAVY SNOW",77:"SNOW GRAINS",80:"SHOWERS",81:"HEAVY SHOWERS",82:"VIOLENT SHOWERS",
 85:"SNOW SHOWERS",86:"HEAVY SNOW SHOWERS",95:"THUNDERSTORM",96:"THUNDERSTORM + HAIL",99:"SEVERE THUNDERSTORM"};
function compass(d){return ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(d/22.5)%16]}
async function loadWeather(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+pos.lat+"&longitude="+pos.lon
     +"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
     +"&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max"
     +"&timezone=auto&forecast_days=2&wind_speed_unit=kmh";
    const r=await fetch(u);const j=await r.json();const c=j.current,d=j.daily;
    const t=s=>s.slice(11,16);
    const parts=[
      pos.label,
      WCODE[c.weather_code]||"—",
      "TEMP "+Math.round(c.temperature_2m)+"°C (FEELS "+Math.round(c.apparent_temperature)+"°)",
      "WIND "+Math.round(c.wind_speed_10m)+" KM/H "+compass(c.wind_direction_10m)+" · GUSTS "+Math.round(c.wind_gusts_10m),
      "HUMIDITY "+c.relative_humidity_2m+"%",
      "CLOUD "+c.cloud_cover+"%",
      "PRESSURE "+Math.round(c.pressure_msl)+" HPA",
      "RAIN NOW "+c.precipitation+" MM",
      "TODAY "+Math.round(d.temperature_2m_min[0])+"° / "+Math.round(d.temperature_2m_max[0])+"° · RAIN CHANCE "+d.precipitation_probability_max[0]+"%",
      "UV "+Math.round(d.uv_index_max[0]),
      "SUNRISE "+t(d.sunrise[0])+" · SUNSET "+t(d.sunset[0])
    ];
    // next few hours
    const now=new Date(c.time).getTime();let hrs=[];
    for(let i=0;i<j.hourly.time.length&&hrs.length<4;i++){
      const ht=new Date(j.hourly.time[i]).getTime();
      if(ht>now&&(ht-now)%(2*3600000)<3600000){
        hrs.push(t(j.hourly.time[i])+" "+Math.round(j.hourly.temperature_2m[i])+"° "+j.hourly.precipitation_probability[i]+"%");
      }
    }
    if(hrs.length)parts.push("NEXT: "+hrs.join("  ·  "));
    tick.textContent=parts.join("   ▪   ")+"   ▪   ";
  }catch(e){
    tick.textContent="WEATHER OFFLINE   ▪   CHECK CONNECTION   ▪   ";
  }
}

/* ---------- location ---------- */
function useFix(lat,lon,real,label){
  pos={lat,lon,real,label:label||(real?"YOUR LOCATION":"DEFAULT")};
  loadRoads();loadWeather();
}
function locate(){
  setStatus("LOCATING…");
  if(!navigator.geolocation||!window.isSecureContext&&location.protocol!=="file:"&&location.protocol!=="content:"){
    // still try; some browsers allow it
  }
  if(!navigator.geolocation){useFix(pos.lat,pos.lon,false,"LAKES ENTRANCE (NO GPS)");return}
  navigator.geolocation.getCurrentPosition(
    p=>useFix(p.coords.latitude,p.coords.longitude,true,"YOUR LOCATION"),
    err=>{
      setStatus("GPS BLOCKED · USING DEFAULT (OPEN VIA HTTPS FOR GPS)");
      useFix(pos.lat,pos.lon,false,"LAKES ENTRANCE (DEFAULT)");
    },
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000}
  );
}
// follow movement + heading
if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
    if(!pos.real)return;
    if(typeof p.coords.heading==="number"&&!isNaN(p.coords.heading))heading=p.coords.heading;
    const moved=Math.hypot((p.coords.latitude-pos.lat)*111320,(p.coords.longitude-pos.lon)*90000);
    if(moved>radiusM*0.4){useFix(p.coords.latitude,p.coords.longitude,true,"YOUR LOCATION")}
    else{pos.lat=p.coords.latitude;pos.lon=p.coords.longitude;draw()}
  },()=>{},{enableHighAccuracy:true,maximumAge:5000});
}

/* ---------- fullscreen ---------- */
const btnFull=document.getElementById("btnFull");
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function setFullUI(on){
  document.body.classList.toggle("full",on);
  btnFull.textContent=on?"Exit":"Full";
  setTimeout(resize,150);
}
async function toggleFull(){
  const el=document.documentElement;
  try{
    if(!isFS()){
      if(el.requestFullscreen)await el.requestFullscreen({navigationUI:"hide"});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
      else{setFullUI(!document.body.classList.contains("full"))} // fallback: hide UI only
    }else{
      if(document.exitFullscreen)await document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }
  }catch(e){setFullUI(!document.body.classList.contains("full"))}
}
document.addEventListener("fullscreenchange",()=>setFullUI(isFS()));
document.addEventListener("webkitfullscreenchange",()=>setFullUI(isFS()));

/* ---------- controls ---------- */
document.getElementById("btnColor").onclick=()=>{pi=(pi+1)%PALETTES.length;applyPalette()};
document.getElementById("btnLoc").onclick=locate;
btnFull.onclick=toggleFull;

// zoom: double-tap in/out, pinch
let lastTap=0;
cv.addEventListener("click",e=>{
  const now=Date.now();
  if(now-lastTap<300){
    radiusM=radiusM>1500?800:radiusM>500?400:4000; // cycle 4km→... crude
    radiusM=({4000:2500,2500:1200,1200:600,600:4000})[radiusM]||2500;
    loadRoads();
  }
  lastTap=now;
});
let pd=0;
cv.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pd){radiusM=Math.max(400,Math.min(6000,radiusM*(pd/d)));draw()}
    pd=d;e.preventDefault();
  }
},{passive:false});
cv.addEventListener("touchend",()=>{if(pd){pd=0;loadRoads()}});

window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));
if(window.ResizeObserver)new ResizeObserver(resize).observe(document.getElementById("mapwrap"));

/* refresh weather every 10 min */
setInterval(loadWeather,600000);

applyPalette();
resize();
locate();
})();
</script>
</body>
</html>
