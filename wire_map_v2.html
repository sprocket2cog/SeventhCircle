<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wire Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --bg:#020a04; --line:#21ff6b; --minor:#0f7a35; --accent:#ffe14a; --text:#9dffbd; --grid:#06240f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--minor)}
#title{font-size:15px;letter-spacing:.25em;color:var(--line);text-shadow:0 0 8px var(--line);white-space:nowrap}
#status{font-size:10px;letter-spacing:.1em;opacity:.85;text-align:right;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapwrap{flex:1;position:relative;min-height:0;background:var(--bg)}
#map{position:absolute;inset:0}
#bar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--minor)}
button,select{background:transparent;color:var(--line);border:1px solid var(--line);
  font:inherit;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:12px 2px;border-radius:2px;cursor:pointer;text-shadow:0 0 6px var(--line)}
button{flex:1;min-width:0}
select{flex:0 0 58px;background:var(--bg);text-shadow:none;padding:12px 0;text-align:center;
  -webkit-appearance:none;appearance:none}
button:active{background:var(--line);color:var(--bg);text-shadow:none}
button.on{background:var(--line);color:var(--bg);text-shadow:none}
#ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--minor);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));font-size:24px;font-weight:700;line-height:1.2;
  letter-spacing:.08em;color:var(--accent);background:rgba(0,0,0,.35)}
#tickInner{display:inline-block;padding-left:100%;animation:scroll 60s linear infinite;will-change:transform}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.corner{position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none;z-index:3}
.tl{top:6px;left:6px;border-right:0;border-bottom:0}.tr{top:6px;right:6px;border-left:0;border-bottom:0}
.bl{bottom:6px;left:6px;border-right:0;border-top:0}.br{bottom:6px;right:6px;border-left:0;border-top:0}
#legend{position:absolute;left:14px;bottom:12px;font-size:10px;letter-spacing:.1em;opacity:.85;
  text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;line-height:1.55;z-index:3}
.maplibregl-ctrl-group{background:rgba(0,0,0,.55)!important;border:1px solid var(--minor);border-radius:2px;box-shadow:none!important}
.maplibregl-ctrl-group button{border:0;width:34px;height:34px;padding:0}
.maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1) sepia(1) saturate(6) hue-rotate(50deg)}
.maplibregl-ctrl-top-right{top:10px;right:10px}
.me svg{filter:drop-shadow(0 0 6px var(--accent));overflow:visible}
.me path{fill:var(--accent)}
.me .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.55;transform-origin:center;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.5);opacity:0}}
#speed{position:absolute;left:14px;top:14px;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none;
  transform-origin:0 0;padding:4px 12px 22px 10px;background:rgba(0,0,0,.6);border:1px solid var(--line);
  border-radius:2px;box-shadow:0 0 12px rgba(0,0,0,.6);cursor:grab;line-height:1}
#spdNum{font-size:48px;font-weight:700;color:var(--line);text-shadow:0 0 10px var(--line);
  min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
#spdUnit{font-size:11px;letter-spacing:.25em;color:var(--accent);text-align:right;margin-top:3px}
#spdTgt{margin-top:8px;padding-top:6px;border-top:1px solid var(--minor);text-align:right}
#spdTgt[hidden]{display:none}
#spdTgtLbl{font-size:9px;letter-spacing:.2em;color:var(--accent)}
#spdTgtVal{font-size:26px;font-weight:700;color:var(--line);text-shadow:0 0 8px var(--line);
  font-variant-numeric:tabular-nums;margin-top:3px}
#spdTgtName{display:block;width:0;min-width:100%;margin-top:3px;font-size:10px;letter-spacing:.08em;opacity:.85;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#spdHandle{position:absolute;left:0;bottom:0;width:22px;height:22px;
  border-left:3px solid var(--accent);border-bottom:3px solid var(--accent);opacity:.9}
.mini{flex:none;padding:7px 10px;font-size:11px}
#search{position:absolute;left:10px;right:10px;top:10px;z-index:7;display:flex;flex-direction:column;gap:6px;
  max-height:78%;padding:8px;background:rgba(0,0,0,.9);border:1px solid var(--line);
  box-shadow:0 0 18px rgba(0,0,0,.8)}
#search[hidden]{display:none}
.srow{display:flex;gap:6px}
#q{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--minor);border-radius:2px;
  font:inherit;font-size:16px;padding:8px 10px;letter-spacing:.05em;outline:none}
#q:focus{border-color:var(--line)}
#qList{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.qi{padding:10px 8px;border-bottom:1px solid var(--grid);font-size:13px;letter-spacing:.05em;color:var(--text);cursor:pointer}
.qi:active{background:var(--grid)}
.qi small{display:block;opacity:.7;font-size:10px;margin-top:3px;letter-spacing:.08em}
.qh{font-size:10px;letter-spacing:.25em;color:var(--accent);padding:6px 8px 2px}
@media (orientation:landscape) and (max-height:480px){
  #top{padding-top:3px;padding-bottom:3px}
  button,select{padding-top:7px;padding-bottom:7px}
  #bar{padding:4px 10px}
  #ticker{padding-top:3px;padding-bottom:3px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">WIRE MAP</div>
    <div id="status">STARTING…</div>
    <button id="btnSearch" class="mini">Search</button>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="legend"></div>
    <div id="speed" title="Drag to move · pinch or drag the corner to resize · tap to switch units">
      <div id="spdNum">--</div><div id="spdUnit">KM/H</div>
      <div id="spdTgt" hidden>
        <div id="spdTgtLbl">TARGET DISTANCE</div>
        <div id="spdTgtVal">--</div>
        <span id="spdTgtName"></span>
      </div>
      <div id="spdHandle"></div>
    </div>
    <div id="search" hidden>
      <div class="srow">
        <input id="q" type="search" placeholder="ROAD OR PLACE NAME" autocomplete="off" autocapitalize="words" enterkeyhint="search">
        <button id="qGo" class="mini">Go</button>
        <button id="qX" class="mini">✕</button>
      </div>
      <div id="qList"></div>
      <div class="srow"><button id="qClear" class="mini" style="flex:1">Clear highlight</button></div>
    </div>
  </div>
  <div id="bar">
    <button id="btnColor">Colour</button>
    <button id="btnLoc">Locate</button>
    <button id="btnNames">Names</button>
    <button id="btnPack">Save</button>
    <select id="packR" aria-label="Area to save">
      <option value="10">10km</option>
      <option value="25" selected>25km</option>
      <option value="50">50km</option>
    </select>
    <button id="btnFull">Full</button>
  </div>
  <div id="ticker"><span id="tickInner">LOADING WEATHER…</span></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
if(typeof maplibregl==="undefined"){
  $("status").textContent="MAP LIBRARY NOT LOADED · CONNECT TO INTERNET AND RELOAD";
  return;
}
const ls={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

//#STYLE_START
const PALETTES=[
 {n:"TERMINAL", bg:"#020a04", line:"#21ff6b", minor:"#0f7a35", accent:"#ffe14a", text:"#9dffbd", grid:"#06240f"},
 {n:"AMBER",    bg:"#0a0602", line:"#ff8a1c", minor:"#8a4a0c", accent:"#25e7ff", text:"#ffd19a", grid:"#2a1604"},
 {n:"NEON",     bg:"#06020f", line:"#ff2bd6", minor:"#5b1a8a", accent:"#25e7ff", text:"#ffb3f0", grid:"#1a0a33"},
 {n:"ICE",      bg:"#020812", line:"#3dd5ff", minor:"#16587a", accent:"#ffffff", text:"#bfeaff", grid:"#06203a"},
 {n:"TOXIC",    bg:"#050a00", line:"#c6ff00", minor:"#5a7a00", accent:"#ff3d3d", text:"#e6ffa0", grid:"#1a2800"},
 {n:"BLOOD",    bg:"#0a0203", line:"#ff3b3b", minor:"#7a1515", accent:"#ffd24a", text:"#ffb3b3", grid:"#2a0808"}
];
const CM={}; // layerId -> {paintProperty: paletteKey}, used to recolour live
function buildStyle(pi){
  const p=PALETTES[pi];
  const L=[];
  const add=(layer,cm)=>{L.push(layer);if(cm)CM[layer.id]=cm};
  const cls=arr=>["match",["get","class"],arr,true,false];
  const W=stops=>["interpolate",["exponential",1.5],["zoom"]].concat(...stops);
  const round={"line-cap":"round","line-join":"round"};
  const name=["coalesce",["get","name:latin"],["get","name"]];
  const font=["Noto Sans Regular"];

  add({id:"bg",type:"background",paint:{"background-color":p.bg}},{"background-color":"bg"});
  add({id:"water",type:"fill",source:"om","source-layer":"water",
       paint:{"fill-color":p.grid,"fill-outline-color":p.minor}},
      {"fill-color":"grid","fill-outline-color":"minor"});
  add({id:"waterway",type:"line",source:"om","source-layer":"waterway",layout:round,
       paint:{"line-color":p.minor,"line-width":W([[8,.5],[14,1.2],[18,3]])}},{"line-color":"minor"});
  add({id:"bldg",type:"line",source:"om","source-layer":"building",minzoom:14.5,
       paint:{"line-color":p.minor,"line-width":.7,"line-opacity":.85}},{"line-color":"minor"});

  add({id:"road_minor",type:"line",source:"om","source-layer":"transportation",minzoom:11,layout:round,
       filter:cls(["minor"]),
       paint:{"line-color":p.minor,"line-width":W([[11,.4],[14,.9],[18,4]])}},{"line-color":"minor"});
  add({id:"road_service",type:"line",source:"om","source-layer":"transportation",minzoom:14,layout:round,
       filter:cls(["service","track"]),
       paint:{"line-color":p.minor,"line-width":W([[14,.5],[18,2.5]]),"line-opacity":.8}},{"line-color":"minor"});
  add({id:"road_tertiary",type:"line",source:"om","source-layer":"transportation",minzoom:9,layout:round,
       filter:cls(["tertiary"]),
       paint:{"line-color":p.line,"line-opacity":.7,"line-width":W([[9,.6],[14,1.4],[18,6]])}},{"line-color":"line"});
  add({id:"road_glow",type:"line",source:"om","source-layer":"transportation",layout:round,
       filter:cls(["motorway","trunk","primary","secondary"]),
       paint:{"line-color":p.line,"line-opacity":.28,"line-blur":4,"line-width":W([[5,3],[12,8],[18,26]])}},{"line-color":"line"});
  add({id:"road_secondary",type:"line",source:"om","source-layer":"transportation",layout:round,
       filter:cls(["secondary"]),
       paint:{"line-color":p.line,"line-width":W([[7,.8],[14,2],[18,8]])}},{"line-color":"line"});
  add({id:"road_main",type:"line",source:"om","source-layer":"transportation",layout:round,
       filter:cls(["motorway","trunk","primary"]),
       paint:{"line-color":p.line,"line-width":W([[5,.9],[12,2.6],[14,3.4],[18,12]])}},{"line-color":"line"});
  add({id:"rail",type:"line",source:"om","source-layer":"transportation",minzoom:8,
       filter:cls(["rail"]),
       paint:{"line-color":p.minor,"line-dasharray":[2,3],"line-width":1}},{"line-color":"minor"});

  // search highlight: by road name in the vector tiles, and by GeoJSON from the online search
  const NONE=["any",["==",["get","name"],"\u0001none"],["==",["get","name:latin"],"\u0001none"]];
  const hid=Object.assign({visibility:"none"},round);   // hidden (and no extra tile loading) until a road is picked
  add({id:"hl_glow",type:"line",source:"omh","source-layer":"transportation_name",layout:hid,filter:NONE,
       paint:{"line-color":p.accent,"line-opacity":.45,"line-blur":5,"line-width":W([[3,10],[12,15],[14,18],[18,36]])}},{"line-color":"accent"});
  add({id:"hl_line",type:"line",source:"omh","source-layer":"transportation_name",layout:hid,filter:NONE,
       paint:{"line-color":p.accent,"line-width":W([[3,3],[12,4.5],[14,5.5],[18,14]])}},{"line-color":"accent"});
  add({id:"hlg_glow",type:"line",source:"hl",layout:round,filter:["!=",["geometry-type"],"Point"],
       paint:{"line-color":p.accent,"line-opacity":.45,"line-blur":5,"line-width":W([[3,10],[12,15],[14,18],[18,36]])}},{"line-color":"accent"});
  add({id:"hlg_line",type:"line",source:"hl",layout:round,filter:["!=",["geometry-type"],"Point"],
       paint:{"line-color":p.accent,"line-width":W([[3,3],[12,4.5],[14,5.5],[18,14]])}},{"line-color":"accent"});
  add({id:"hlg_pt",type:"circle",source:"hl",filter:["==",["geometry-type"],"Point"],
       paint:{"circle-color":p.accent,"circle-radius":8,"circle-stroke-color":p.bg,"circle-stroke-width":2}},
      {"circle-color":"accent","circle-stroke-color":"bg"});
  // beacon: pulsing ring on the nearest point of the road + dashed "crow flies" line from you
  add({id:"hlb_line",type:"line",source:"hlb",filter:["==",["geometry-type"],"LineString"],layout:{"line-cap":"round"},
       paint:{"line-color":p.accent,"line-width":1.6,"line-opacity":.85,"line-dasharray":[2,2]}},{"line-color":"accent"});
  add({id:"hlb_ring",type:"circle",source:"hlb",filter:["==",["geometry-type"],"Point"],
       paint:{"circle-radius":18,"circle-color":p.accent,"circle-opacity":0,"circle-stroke-color":p.accent,
              "circle-stroke-width":3,"circle-stroke-opacity":.9}},{"circle-stroke-color":"accent","circle-color":"accent"});
  add({id:"hlb_dot",type:"circle",source:"hlb",filter:["==",["geometry-type"],"Point"],
       paint:{"circle-radius":5,"circle-color":p.accent,"circle-stroke-color":p.bg,"circle-stroke-width":2}},
      {"circle-color":"accent","circle-stroke-color":"bg"});

  add({id:"road_names",type:"symbol",source:"om","source-layer":"transportation_name",minzoom:11,
       filter:cls(["motorway","trunk","primary","secondary","tertiary"]),
       layout:{"symbol-placement":"line","text-field":name,"text-font":font,"text-size":10,
               "text-letter-spacing":.1,"text-transform":"uppercase","symbol-spacing":320},
       paint:{"text-color":p.accent,"text-halo-color":p.bg,"text-halo-width":1.6}},
      {"text-color":"accent","text-halo-color":"bg"});
  add({id:"places",type:"symbol",source:"om","source-layer":"place",minzoom:8,
       filter:cls(["city","town","village","suburb","hamlet"]),
       layout:{"text-field":name,"text-font":font,
               "text-size":["interpolate",["linear"],["zoom"],8,10,15,14],
               "text-transform":"uppercase","text-letter-spacing":.15,"text-max-width":8},
       paint:{"text-color":p.text,"text-halo-color":p.bg,"text-halo-width":1.6}},
      {"text-color":"text","text-halo-color":"bg"});
  add({id:"hl_name",type:"symbol",source:"omh","source-layer":"transportation_name",filter:NONE,
       layout:{"visibility":"none","symbol-placement":"line","text-field":name,"text-font":font,"text-size":13,
               "text-letter-spacing":.1,"text-transform":"uppercase","symbol-spacing":250,
               "text-allow-overlap":true,"text-ignore-placement":true},
       paint:{"text-color":p.accent,"text-halo-color":p.bg,"text-halo-width":2}},
      {"text-color":"accent","text-halo-color":"bg"});

  return {
    version:8,
    glyphs:"wmg://{fontstack}/{range}",
    sources:{om:{type:"vector",tiles:["wm://{z}/{x}/{y}"],minzoom:0,maxzoom:14},
             // same tiles, but fetched one zoom level deeper so a highlighted road is complete when zoomed out
             omh:{type:"vector",tiles:["wm://{z}/{x}/{y}"],minzoom:0,maxzoom:14},
             hl:{type:"geojson",data:{type:"FeatureCollection",features:[]}},
             hlb:{type:"geojson",data:{type:"FeatureCollection",features:[]}}},
    layers:L
  };
}
//#STYLE_END

/* ---------- state ---------- */
let pi=(+ls.get("wm_pal")||0)%PALETTES.length;
const HOME_Q="Bung Yarnda Court, Lakes Entrance VIC";
let HOME={lat:-37.8806,lon:147.9811};   // Lakes Entrance town centre until the street has been looked up once
try{const h=JSON.parse(ls.get("wm_home"));if(h&&isFinite(h.lat)&&isFinite(h.lon))HOME={lat:h.lat,lon:h.lon}}catch(e){}
let user={lat:HOME.lat,lon:HOME.lon,real:false},userMoved=false;
let tplFresh=false,TS={net:0,cache:0,empty:0,fail:0,last:""};
let follow=true,firstFix=false,watchId=null,map=null,marker=null,TPL=null,tilesSaved=0;
let lastErr="",errCount=0;const errLog=[];
const statusEl=$("status"),legend=$("legend"),tick=$("tickInner");
const setStatus=t=>{statusEl.textContent=t};

/* ---------- local tile store (IndexedDB) ---------- */
const IDB={db:null,ok:false,
  open(){return new Promise(res=>{try{
    const rq=indexedDB.open("wiremap",1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore("t");
    rq.onsuccess=()=>{IDB.db=rq.result;IDB.ok=true;res(true)};
    rq.onerror=()=>res(false);rq.onblocked=()=>res(false);
  }catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!IDB.ok)return res(undefined);try{
    const r=IDB.db.transaction("t").objectStore("t").get(k);
    r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined);}catch(e){res(undefined)}})},
  has(k){return new Promise(res=>{if(!IDB.ok)return res(false);try{
    const r=IDB.db.transaction("t").objectStore("t").count(k);
    r.onsuccess=()=>res(r.result>0);r.onerror=()=>res(false);}catch(e){res(false)}})},
  put(k,v){return new Promise(res=>{if(!IDB.ok)return res();try{
    const tx=IDB.db.transaction("t","readwrite");tx.objectStore("t").put(v,k);
    tx.oncomplete=()=>res();tx.onerror=()=>res();tx.onabort=()=>res();}catch(e){res()}})},
  purgeEmpty(){return new Promise(res=>{if(!IDB.ok)return res(0);try{   // remove empty tiles saved by older versions
    const tx=IDB.db.transaction("t","readwrite"),st=tx.objectStore("t");let n=0;
    st.openCursor().onsuccess=e=>{const c=e.target.result;if(!c)return;
      if(c.value&&c.value.byteLength===0){c.delete();n++}c.continue()};
    tx.oncomplete=()=>res(n);tx.onerror=()=>res(0);tx.onabort=()=>res(0);}catch(e){res(0)}})},
  count(){return new Promise(res=>{if(!IDB.ok)return res(0);try{
    const r=IDB.db.transaction("t").objectStore("t").count();
    r.onsuccess=()=>res(r.result);r.onerror=()=>res(0);}catch(e){res(0)}})}
};

async function fetchBuf(url,signal,ms){
  const c=new AbortController();
  const to=setTimeout(()=>c.abort(),ms||15000);
  if(signal)signal.addEventListener("abort",()=>c.abort());
  try{
    const r=await fetch(url,{signal:c.signal});
    if(r.status===204)return new ArrayBuffer(0);
    if(!r.ok){const er=new Error("HTTP "+r.status);er.status=r.status;throw er}
    return await r.arrayBuffer();
  }finally{clearTimeout(to)}
}
async function initTpl(){
  try{
    const r=await fetch("https://tiles.openfreemap.org/planet",{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
    const j=await r.json();
    if(j.tiles&&j.tiles[0]){TPL=j.tiles[0];tplFresh=true;ls.set("wm_tpl",TPL)}
  }catch(e){}
  if(!TPL)TPL=ls.get("wm_tpl");
}
async function getTile(z,x,y,signal){
  const k=z+"/"+x+"/"+y;
  const hit=await IDB.get(k);
  if(hit&&hit.byteLength>0){TS.cache++;return hit}
  if(!TPL)throw new Error("no tile source");
  let err;
  for(let i=0;i<2;i++){
    try{
      const buf=await fetchBuf(TPL.replace("{z}",z).replace("{x}",x).replace("{y}",y),signal);
      if(buf.byteLength===0){TS.empty++;return buf}      // never store empty tiles
      TS.net++;TS.last="OK "+buf.byteLength+"B";
      IDB.put(k,buf);                 // structured clone happens now, before MapLibre takes the buffer
      return buf;
    }catch(e){
      err=e;if(signal&&signal.aborted)break;
      if(e.status===404){
        if(!tplFresh){await initTpl();continue}           // saved tile address may be out of date: refresh and retry
        TS.empty++;return new ArrayBuffer(0);              // genuinely empty tile (sea etc.), not stored
      }
    }
  }
  TS.fail++;TS.last=String(err&&err.message||err).slice(0,20);
  throw err;
}
function glyphUrl(path){
  const i=path.lastIndexOf("/");
  return "https://tiles.openfreemap.org/fonts/"+encodeURIComponent(path.slice(0,i))+"/"+path.slice(i+1)+".pbf";
}
async function getGlyph(path,signal){
  const k="g/"+path;
  const hit=await IDB.get(k);
  if(hit)return hit;
  const buf=await fetchBuf(glyphUrl(path),signal);
  IDB.put(k,buf);
  return buf;
}
maplibregl.addProtocol("wm",async(params,abort)=>{

/* ---------- GPS ---------- */
function onFix(p){
  const wasReal=user.real;
  user={lat:p.coords.latitude,lon:p.coords.longitude,real:true};
  let v=p.coords.speed;
  if((v==null||isNaN(v))&&lastFix){
    const dt=(p.timestamp-lastFix.ts)/1000;
    if(dt>0.2)v=hav(lastFix.lat,lastFix.lon,user.lat,user.lon)/dt;
  }
  lastFix={lat:user.lat,lon:user.lon,ts:p.timestamp,at:Date.now(),v:(v==null||isNaN(v))?null:v};
  if(typeof p.coords.heading==="number"&&!isNaN(p.coords.heading))marker.setRotation(p.coords.heading);
  marker.setLngLat([user.lon,user.lat]);
  if(!firstFix){
    firstFix=true;
    map.jumpTo({center:[user.lon,user.lat],zoom:14});
    loadWeather();
  }else if(follow){
    map.easeTo({center:[user.lon,user.lat],duration:600});
  }
  if(!wasReal)$("btnLoc").classList.add("on");
  setStatus("GPS LOCK · "+(p.coords.accuracy?Math.round(p.coords.accuracy)+" M":""));
}
function noGPS(){
  if(user.real)return;
  setStatus("NO GPS · SHOWING HOME STREET · TAP MAP TO MOVE YOU");
  if(!firstFix){firstFix=true;loadWeather()}
}
function startGPS(){
  if(!navigator.geolocation){noGPS();return}
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onFix,noGPS,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

/* ---------- save an area (local map pack) ---------- */
let packing=false,packCancel=false;
const lon2x=(lon,z)=>Math.floor((lon+180)/360*(1<<z));
const lat2y=(lat,z)=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*(1<<z))};
async function packArea(o){
  const btn=$("btnPack");
  if(packing){packCancel=true;return}
  if(!IDB.ok){setStatus("STORAGE BLOCKED · OPEN PAGE OVER HTTPS (GITHUB PAGES) TO SAVE MAPS");return}
  if(!TPL){setStatus("NO TILE SOURCE · CONNECT TO INTERNET FIRST");return}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const auto=!!(o&&o.auto);                       // auto = background save of the home area
  const c=auto?{lat:o.lat,lng:o.lon}:map.getCenter(),R=auto?o.R:+$("packR").value,maxZ=R>=50?13:14;
  const dLat=R/111.32,dLon=R/(111.32*Math.cos(c.lat*Math.PI/180));
  const jobs=[];
  for(let z=4;z<=maxZ;z++){
    const n=(1<<z)-1;
    const x0=Math.max(0,lon2x(c.lng-dLon,z)),x1=Math.min(n,lon2x(c.lng+dLon,z));
    const y0=Math.max(0,lat2y(c.lat+dLat,z)),y1=Math.min(n,lat2y(c.lat-dLat,z));
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)jobs.push([z,x,y]);
  }
  packing=true;packCancel=false;btn.textContent="Stop";btn.classList.add("on");
  const total=jobs.length+2;let done=0,fail=0,bytes=0;
  const show=()=>setStatus("SAVING "+done+"/"+total+" · "+(bytes/1048576).toFixed(1)+" MB"+(fail?" · "+fail+" FAILED":""));
  // fonts for labels
  for(const rng of ["0-255","256-511"]){
    try{const b=await getGlyph("Noto Sans Regular/"+rng);bytes+=b.byteLength}catch(e){fail++}
    done++;
  }
  show();
  const worker=async()=>{
    while(!packCancel&&jobs.length){
      const [z,x,y]=jobs.shift(),k=z+"/"+x+"/"+y;
      try{
        if(!(await IDB.has(k))){const b=await getTile(z,x,y);bytes+=b.byteLength}
      }catch(e){fail++}
      done++;if(done%8===0)show();
    }
  };
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  show();
  const stopped=packCancel;
  packing=false;packCancel=false;btn.textContent="Save";btn.classList.remove("on");
  await updateLegend();
  if(auto&&!stopped&&!fail)ls.set("wm_homepack","1");
  setStatus((stopped?"SAVE STOPPED · ":"AREA SAVED · ")+tilesSaved+" TILES STORED"+(fail?" · "+fail+" FAILED (RETRY)":""));
}

/* ---------- speed overlay (drag, pinch/corner-resize, tap = units) ---------- */
let lastFix=null,spdUnit="kmh";
const hav=(la1,lo1,la2,lo2)=>{
  const R=6371000,r=Math.PI/180,dLa=(la2-la1)*r,dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
};
const spd=$("speed"),spdHandle=$("spdHandle");
const S={l:14,t:14,s:1};
try{const o=JSON.parse(ls.get("wm_spd"));if(o){S.l=+o.l||14;S.t=+o.t||14;S.s=+o.s||1;spdUnit=o.u==="mph"?"mph":"kmh"}}catch(e){}
function spdSave(){ls.set("wm_spd",JSON.stringify({l:S.l,t:S.t,s:S.s,u:spdUnit}))}
function spdPlace(){
  const wr=$("mapwrap").getBoundingClientRect();
  S.s=Math.min(3,Math.max(.5,S.s));
  const w=spd.offsetWidth*S.s,h=spd.offsetHeight*S.s;
  S.l=Math.max(0,Math.min(S.l,wr.width-w));
  S.t=Math.max(0,Math.min(S.t,wr.height-h));

}
function speedTick(){
  const f=lastFix,num=$("spdNum"),unit=$("spdUnit");
  unit.textContent=spdUnit==="mph"?"MPH":"KM/H";
  if(!f||f.v===null||Date.now()-f.at>6000){num.textContent="--";return}
  const v=f.v<0.5?0:f.v;
  num.textContent=Math.round(spdUnit==="mph"?v*2.23694:v*3.6);
}
const ptrs=new Map();
let drag=null,pinch=null,resize=null,moved=false,downAt=0;
const two=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
spd.addEventListener("pointerdown",e=>{
  e.preventDefault();
  try{spd.setPointerCapture(e.pointerId)}catch(x){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(e.target===spdHandle){
    const r=spd.getBoundingClientRect();           // scale from the overlay's top-left corner
    resize={id:e.pointerId,ox:r.left,oy:r.top,d0:Math.hypot(e.clientX-r.left,e.clientY-r.top)||1,s0:S.s};
    drag=null;pinch=null;
  }else if(ptrs.size===1){
    drag={x:e.clientX,y:e.clientY,l:S.l,t:S.t};moved=false;downAt=Date.now();
  }else if(ptrs.size===2){
    pinch={d0:two(),s0:S.s};drag=null;moved=true;
  }
});
spd.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(resize&&resize.id===e.pointerId){
    S.s=resize.s0*Math.hypot(e.clientX-resize.ox,e.clientY-resize.oy)/resize.d0;spdPlace();return;
  }
  if(pinch&&ptrs.size>=2){S.s=pinch.s0*two()/pinch.d0;spdPlace();return}
  if(drag){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>6)moved=true;
    S.l=drag.l+dx;S.t=drag.t+dy;spdPlace();
  }
});
function spdUp(e){
  const tap=!!drag&&!moved&&!resize&&!pinch&&(Date.now()-downAt<500)&&e.type==="pointerup";
  ptrs.delete(e.pointerId);
  if(resize&&resize.id===e.pointerId)resize=null;
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)drag=null;
  else if(ptrs.size===1&&!resize){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,l:S.l,t:S.t};moved=true}
  if(tap){spdUnit=spdUnit==="kmh"?"mph":"kmh";speedTick()}
  spdSave();
}

//#PURE_START
function geomLines(g,out){
  if(!g)return;
  const t=g.type,c=g.coordinates;
  if(t==="Point")out.push([c]);
  else if(t==="MultiPoint")c.forEach(p=>out.push([p]));
  else if(t==="LineString")out.push(c);
  else if(t==="MultiLineString")c.forEach(l=>out.push(l));
  else if(t==="Polygon")c.forEach(l=>out.push(l));
  else if(t==="MultiPolygon")c.forEach(p=>p.forEach(l=>out.push(l)));
}
/* nearest point (as the crow flies) on a set of lines, measured from ref {lat,lon} */
function nearestOn(lines,ref){
  const mLat=111320,mLon=111320*Math.cos(ref.lat*Math.PI/180);
  let best=Infinity,nx=0,ny=0;
  for(const ln of lines){
    if(!ln||!ln.length)continue;
    let ax=(ln[0][0]-ref.lon)*mLon,ay=(ln[0][1]-ref.lat)*mLat;
    if(ln.length===1){const d=Math.hypot(ax,ay);if(d<best){best=d;nx=ax;ny=ay}continue}
    for(let i=1;i<ln.length;i++){
      const bx=(ln[i][0]-ref.lon)*mLon,by=(ln[i][1]-ref.lat)*mLat;
      const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
      let t=L?-(ax*dx+ay*dy)/L:0;t=t<0?0:t>1?1:t;
      const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(px,py);
      if(d<best){best=d;nx=px;ny=py}
      ax=bx;ay=by;
    }
  }
  return isFinite(best)?{d:best,lon:ref.lon+nx/mLon,lat:ref.lat+ny/mLat}:null;
}
function fmtDist(d){return d<1000?Math.round(d)+" M":d<100000?(d/1000).toFixed(1)+" KM":Math.round(d/1000)+" KM"}

/* minimal vector-tile reader: pulls the road-name lines out of a z14 tile */
function mvtRoads(buf){
  const u8=new Uint8Array(buf),dec=new TextDecoder();
  let p=0;
  function rd(){
    let r=0,m=1,b;
    do{b=u8[p++];if(b===undefined)throw new Error("eof");r+=(b&127)*m;m*=128}while(b&128);
    return r;
  }
  function skip(wt){
    if(wt===0)rd();else if(wt===1)p+=8;else if(wt===2){const l=rd();p+=l}else if(wt===5)p+=4;else throw new Error("bad wire type");
  }
  function readValue(s,e){
    const save=p;p=s;let v="";
    while(p<e){
      const key=rd(),f=Math.floor(key/8),wt=key%8;
      if(f===1&&wt===2){const l=rd();v=dec.decode(u8.subarray(p,p+l));p+=l}else skip(wt);
    }
    p=save;return v;
  }
  function readFeature(s,e,keys,vals){
    const save=p;p=s;let type=0;const tags=[],geom=[];
    while(p<e){
      const key=rd(),f=Math.floor(key/8),wt=key%8;
      if(f===2&&wt===2){const l=rd(),le=p+l;while(p<le)tags.push(rd())}
      else if(f===3&&wt===0)type=rd();
      else if(f===4&&wt===2){const l=rd(),le=p+l;while(p<le)geom.push(rd())}
      else skip(wt);
    }
    p=save;
    if(type!==2)return null;
    const props={};
    for(let i=0;i+1<tags.length;i+=2)props[keys[tags[i]]]=vals[tags[i+1]];
    return {props:props,geom:geom};
  }
  function readLayer(lend){
    let name="",extent=4096;const keys=[],vals=[],feats=[];
    while(p<lend){
      const key=rd(),f=Math.floor(key/8),wt=key%8;
      if(wt===2){
        const len=rd(),s=p,e=p+len;
        if(f===1)name=dec.decode(u8.subarray(s,e));
        else if(f===2)feats.push([s,e]);
        else if(f===3)keys.push(dec.decode(u8.subarray(s,e)));
        else if(f===4)vals.push(readValue(s,e));
        p=e;
      }else if(wt===0){const v=rd();if(f===5)extent=v}
      else skip(wt);
    }
    if(name!=="transportation_name")return null;
    const out=[];
    for(const se of feats){const ft=readFeature(se[0],se[1],keys,vals);if(ft)out.push(ft)}
    return {extent:extent,feats:out};
  }
  const res=[];
  while(p<u8.length){
    const key=rd(),f=Math.floor(key/8),wt=key%8;
    if(f===3&&wt===2){const len=rd(),lend=p+len;const L=readLayer(lend);if(L)res.push(L);p=lend}
    else skip(wt);
  }
  return res;
}
function mvtLines(geom){
  const lines=[];let x=0,y=0,cur=null,i=0;
  while(i<geom.length){
    const c=geom[i++],cmd=c&7,n=c>>>3;
    for(let k=0;k<n;k++){
      if(cmd===7)continue;
      const dx=geom[i++],dy=geom[i++];
      x+=(dx>>>1)^-(dx&1);y+=(dy>>>1)^-(dy&1);
      if(cmd===1){cur=[];lines.push(cur)}
      if(cur)cur.push([x,y]);
    }
  }
  return lines;
}
function tileToLL(z,X,Y,x,y,ext){
  const n=Math.pow(2,z),lon=(X+x/ext)/n*360-180,r=Math.PI-2*Math.PI*(Y+y/ext)/n;
  return [lon,180/Math.PI*Math.atan(.5*(Math.exp(r)-Math.exp(-r)))];
}
//#PURE_END

function refreshLines(){                  // remember every piece of the road seen so far, so distance stays stable
  const out=[];
  for(const f of hlOnlineFeats)geomLines(f.geometry,out);
  for(const f of hlTraceFeats)geomLines(f.geometry,out);
  if(hlTileName&&map&&map.getSource("omh")){
    try{for(const f of map.querySourceFeatures("omh",{sourceLayer:"transportation_name",filter:hlFilter(hlTileName)}))geomLines(f.geometry,out)}catch(e){}
  }
  for(const ln of out){
    if(!ln||!ln.length)continue;
    const a=ln[0],b=ln[ln.length-1];
    const k=ln.length+"|"+a[0].toFixed(5)+","+a[1].toFixed(5)+"|"+b[0].toFixed(5)+","+b[1].toFixed(5);
    if(!hlLineMap.has(k)&&hlLineMap.size<8000)hlLineMap.set(k,ln);
  }
}
function tgtTick(){                       // speed-box target distance + beacon on the map
  const box=$("spdTgt"),src=map&&map.getSource?map.getSource("hlb"):null;
  if(!hlCurName){
    if(!box.hidden){box.hidden=true;spdPlace()}
    if(src&&beaconOn){try{src.setData({type:"FeatureCollection",features:[]})}catch(e){}beaconOn=false}
    return;
  }
  const n=nearestOn(hlLineMap.values(),{lat:user.lat,lon:user.lon});
  if(box.hidden){box.hidden=false;spdPlace()}
  $("spdTgtName").textContent=hlCurName.toUpperCase();
  $("spdTgtVal").textContent=!n?"--":(n.d<10000?Math.round(n.d)+" M":(n.d/1000).toFixed(1)+" KM");
  if(src&&n){
    try{src.setData({type:"FeatureCollection",features:[
      {type:"Feature",properties:{},geometry:{type:"Point",coordinates:[n.lon,n.lat]}},
      {type:"Feature",properties:{},geometry:{type:"LineString",coordinates:[[user.lon,user.lat],[n.lon,n.lat]]}}]})}catch(e){}
    beaconOn=true;
  }
}

/* follow the road from tile to tile (z14) to collect its whole length */
async function traceRoad(name,seeds,tok){
  const Z=14,want=name.toLowerCase().trim(),seen=new Set(),queue=[],lines=[];
  const add=(X,Y)=>{
    const n=Math.pow(2,Z);
    if(X<0||Y<0||X>=n||Y>=n)return;
    const k=X+"/"+Y;
    if(seen.has(k)||seen.size>=80)return;
    seen.add(k);queue.push([X,Y]);
  };
  for(const s of seeds)add(lon2x(s[0],Z),lat2y(s[1],Z));
  while(queue.length){
    if(tok!==traceToken)return null;
    const batch=queue.splice(0,4);
    await Promise.all(batch.map(async function(t){
      const X=t[0],Y=t[1];
      let buf;try{buf=await getTile(Z,X,Y)}catch(e){return}
      if(!buf||!buf.byteLength)return;
      let layers;try{layers=mvtRoads(buf)}catch(e){return}
      for(const L of layers)for(const f of L.feats){
        const pr=f.props;
        const nm=[pr.name,pr["name:latin"],pr.name_en].map(v=>(v||"").toLowerCase().trim());
        if(nm.indexOf(want)<0)continue;
        const ext=L.extent;let W=false,E=false,N=false,S=false;
        for(const ln of mvtLines(f.geom)){
          for(const pt of ln){
            if(pt[0]<=0)W=true;
            if(pt[0]>=ext)E=true;
            if(pt[1]<=0)N=true;
            if(pt[1]>=ext)S=true;
          }
          lines.push(ln.map(pt=>tileToLL(Z,X,Y,pt[0],pt[1],ext)));
        }
        if(W)add(X-1,Y);
        if(E)add(X+1,Y);
        if(N)add(X,Y-1);
        if(S)add(X,Y+1);
      }
    }));
  }
  return tok===traceToken?lines:null;
}
async function startTrace(name,seeds,refit){
  const tok=++traceToken;
  const lines=await traceRoad(name,seeds,tok);
  if(tok!==traceToken||!hlCurName||!lines||!lines.length)return 0;
  hlTraceFeats=lines.map(ln=>({type:"Feature",properties:{},geometry:{type:"LineString",coordinates:ln}}));
  hlRender();
  if(refit)fitFeats(hlOnlineFeats.concat(hlTraceFeats));
  return lines.length;
}
function seedsFrom(geoms){
  const out=[],seen=new Set();
  for(const g of geoms){
    const L=[];geomLines(g,L);
    for(const ln of L){
      if(!ln.length)continue;
      for(const pt of [ln[0],ln[ln.length-1],ln[(ln.length/2)|0]]){
        const k=lon2x(pt[0],14)+"/"+lat2y(pt[1],14);
        if(!seen.has(k)&&out.length<30){seen.add(k);out.push(pt)}
      }
    }
  }
  return out;
}
async function supplementGeo(name){       // fallback if tile tracing found nothing: OpenStreetMap geometry
  try{
    const c=map.getCenter(),d=.25,vb=[c.lng-d,c.lat+d,c.lng+d,c.lat-d].join(",");
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&limit=40&dedupe=0&bounded=1&viewbox="+vb+"&q="+encodeURIComponent(name));
    if(!r.ok)return;
    const j=await r.json();
    if(hlCurName!==name)return;
    const fs=(j.features||[]).filter(f=>f.geometry&&/LineString/.test(f.geometry.type))
      .map(f=>({type:"Feature",properties:{},geometry:f.geometry}));
    if(fs.length)hlGeo(fs,name);
  }catch(e){}
}
function extend(b,c){
  if(typeof c[0]==="number"){b[0]=Math.min(b[0],c[0]);b[1]=Math.min(b[1],c[1]);b[2]=Math.max(b[2],c[0]);b[3]=Math.max(b[3],c[1])}
  else for(const x of c)extend(b,x);
}
function fitFeats(feats){
  const b=[180,90,-180,-90];
  for(const f of feats)if(f.geometry&&f.geometry.coordinates)extend(b,f.geometry.coordinates);
  if(b[0]>b[2])return;
  follow=false;$("btnLoc").classList.remove("on");
  if(b[0]===b[2]&&b[1]===b[3])map.flyTo({center:[b[0],b[1]],zoom:15,duration:800});
  else map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:70,maxZoom:17,duration:800});
}
function localSearch(q){
  const ql=q.toLowerCase(),seen=new Map();
  let feats=[];
  try{feats=map.querySourceFeatures("om",{sourceLayer:"transportation_name"})}catch(e){}
  for(const f of feats){
    const n=nameOf(f);
    if(!n||n.toLowerCase().indexOf(ql)<0)continue;
    const e=seen.get(n)||{name:n,cls:f.properties["class"],feats:[]};
    e.feats.push(f);seen.set(n,e);
  }
  const ref={lat:user.lat,lon:user.lon},out=[];
  for(const e of seen.values()){
    const L=[];e.feats.forEach(f=>geomLines(f.geometry,L));
    const nr=nearestOn(L,ref);
    e.d=nr?nr.d:Infinity;
    e.sub=(e.cls||"road").toUpperCase()+(isFinite(e.d)?" · "+fmtDist(e.d)+" AWAY":"");
    out.push(e);
  }
  return out.sort((a,b)=>a.d-b.d).slice(0,8);      // nearest first
}
function mkItem(title,sub,fn){
  const d=document.createElement("div");d.className="qi";
  d.appendChild(document.createTextNode(title));
  if(sub){const s=document.createElement("small");s.textContent=sub;d.appendChild(s)}
  if(fn)d.onclick=fn;
  return d;
}
function mkHead(t){const d=document.createElement("div");d.className="qh";d.textContent=t;return d}
function renderList(){
  qList.textContent="";
  qList.appendChild(mkHead("ON MAP · NEAREST FIRST"));
  if(!localRes.length){
    const short=qIn.value.trim().length<2;
    qList.appendChild(mkItem(short?"TYPE A ROAD NAME":"NO MATCH ON SCREEN","TAP HERE OR PRESS GO TO SEARCH ONLINE",short?null:doOnline));
  }
  for(const e of localRes)qList.appendChild(mkItem(e.name,e.sub,()=>pickLocal(e)));
  if(onlineMsg||onlineRes){
    qList.appendChild(mkHead("ONLINE · NEAREST FIRST"));
    if(onlineMsg)qList.appendChild(mkItem(onlineMsg,"",null));
    for(const g of onlineRes||[])qList.appendChild(mkItem(g.title,g.sub,()=>pickOnline(g)));
  }
}
function pickLocal(e){
  hlClear();hlName(e.name);fitFeats(e.feats);closeSearch();
  setStatus("HIGHLIGHT · "+e.name.toUpperCase());
  setTimeout(()=>{refreshLines();tgtTick()},700);
  startTrace(e.name,seedsFrom(e.feats.map(f=>f.geometry)),true).then(n=>{if(!n)supplementGeo(e.name)});
}
function pickOnline(g){
  hlClear();
  if(g.road)hlName(g.title);
  hlGeo(g.feats,g.title);
  if(g.src==="ph"&&g.extent&&g.extent.length===4){
    follow=false;$("btnLoc").classList.remove("on");
    map.fitBounds([[g.extent[0],g.extent[3]],[g.extent[2],g.extent[1]]],{padding:70,maxZoom:17,duration:800});
  }else fitFeats(g.feats);
  closeSearch();
  setStatus("HIGHLIGHT · "+g.title.toUpperCase());
  if(g.road)startTrace(g.title,seedsFrom(g.feats.map(f=>f.geometry)),true);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function nomSearch(q,ref,bounded){
  const d=.7,vb=[ref.lon-d,ref.lat+d,ref.lon+d,ref.lat-d].join(",");
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=geojson&polygon_geojson=1&dedupe=0&limit="+(bounded?40:25)
    +(bounded?"&bounded=1&viewbox="+vb:"")+"&q="+encodeURIComponent(q));
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json(),groups=new Map();
  for(const f of j.features||[]){
    if(!f.geometry)continue;
    const p=f.properties||{},dn=p.display_name||p.name||q;
    const g=groups.get(dn)||{src:"nom",title:p.name||dn.split(",")[0].trim(),
      tail:dn.split(",").slice(1,3).join(",").trim(),road:p.category==="highway",feats:[]};
    g.feats.push({type:"Feature",properties:{},geometry:f.geometry});
    groups.set(dn,g);
  }
  const arr=[...groups.values()];
  for(const g of arr){
    const L=[];g.feats.forEach(f=>geomLines(f.geometry,L));
    const nr=nearestOn(L,ref);
    g.d=nr?nr.d:Infinity;
    g.sub=(isFinite(g.d)?fmtDist(g.d)+" AWAY · ":"")+g.tail;
  }
  return arr.sort((a,b)=>a.d-b.d);
}
async function doOnline(){
  const q=qIn.value.trim();
  if(q.length<2)return;
  onlineRes=null;onlineMsg="SEARCHING…";renderList();
  const ref={lat:user.lat,lon:user.lon};
  let res=null,msg="";
  try{
    res=await nomSearch(q,ref,true);                      // 1) close to you
    if(!res.length){
      onlineMsg="NOTHING WITHIN ~80 KM · WIDENING SEARCH…";renderList();
      await sleep(1100);                                  // be polite to the free service
      res=await nomSearch(q,ref,false);                   // 2) anywhere, still nearest first
      msg="NOTHING NEARBY · NEAREST MATCHES ANYWHERE:";
    }
  }catch(e1){
    try{
      const r=await fetch("https://photon.komoot.io/api/?limit=10&lat="+ref.lat+"&lon="+ref.lon+"&q="+encodeURIComponent(q));
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      res=(j.features||[]).filter(f=>f.geometry).map(f=>{
        const p=f.properties||{},L=[];geomLines(f.geometry,L);
        const nr=nearestOn(L,ref),d=nr?nr.d:Infinity;
        const tail=[p.street,p.city||p.county,p.state].filter(Boolean).join(", ");
        return {src:"ph",title:p.name||q,d:d,sub:(isFinite(d)?fmtDist(d)+" AWAY · ":"")+tail,
          feats:[{type:"Feature",properties:{},geometry:f.geometry}],road:p.osm_key==="highway",extent:p.extent};
      }).sort((a,b)=>a.d-b.d);
    }catch(e2){res=null}
  }
  if(res===null){onlineMsg="ONLINE SEARCH FAILED · CHECK CONNECTION";onlineRes=null}
  else if(!res.length){onlineMsg="NOTHING FOUND";onlineRes=null}
  else{onlineMsg=msg;onlineRes=res}
  renderList();
}
function openSearch(){sp.hidden=false;renderList();setTimeout(()=>qIn.focus(),60)}
function closeSearch(){sp.hidden=true;qIn.blur()}
$("btnSearch").onclick=()=>{sp.hidden?openSearch():closeSearch()};
$("qX").onclick=closeSearch;
$("qGo").onclick=doOnline;
$("qClear").onclick=()=>{
  hlClear();localRes=[];onlineRes=null;onlineMsg="";qIn.value="";renderList();closeSearch();
  setStatus("HIGHLIGHT CLEARED");
};
let qTimer=null;
qIn.addEventListener("input",()=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{
    const q=qIn.value.trim();
    localRes=q.length>=2?localSearch(q):[];onlineRes=null;onlineMsg="";renderList();
  },180);
});
qIn.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();doOnline()}
  if(e.key==="Escape")closeSearch();
});

setInterval(tgtTick,1000);

/* ---------- controls ---------- */
$("btnNames").onclick=()=>{namesOn=!namesOn;ls.set("wm_names",namesOn?"1":"0");applyNames(namesOn)};
$("btnColor").onclick=()=>{pi=(pi+1)%PALETTES.length;applyPalette()};
$("btnLoc").onclick=()=>{
  follow=true;$("btnLoc").classList.add("on");
  if(user.real)map.flyTo({center:[user.lon,user.lat],zoom:Math.max(map.getZoom(),14),bearing:0});
  else{setStatus("LOCATING…");startGPS();map.flyTo({center:[user.lon,user.lat],zoom:Math.max(map.getZoom(),14),bearing:0})}
};
$("btnPack").onclick=packArea;
btnFull.onclick=toggleFull;

window.addEventListener("resize",()=>map&&map.resize());
window.addEventListener("orientationchange",()=>setTimeout(()=>map&&map.resize(),300));
if(window.ResizeObserver)new ResizeObserver(()=>map&&map.resize()).observe($("mapwrap"));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadWeather()});
setInterval(loadWeather,600000);

/* ---------- home street + blank-map explanation ---------- */
function emptyCheck(){                    // black map? say why instead of leaving it blank
  if(!map||map.isMoving()||map.getZoom()<11)return;
  let n=0;
  try{n=map.queryRenderedFeatures({layers:["road_main","road_secondary","road_tertiary","road_minor"]}).length}catch(e){return}
  if(n===0)setStatus(navigator.onLine===false?"OFFLINE · NO SAVED MAP HERE · TAP SAVE WHEN ONLINE":"NO ROADS IN VIEW · ZOOM OUT OR TAP LOCATE");
}
async function resolveHome(){             // look the home street up once, then remember it
  if(ls.get("wm_home"))return true;
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=au&q="+encodeURIComponent(HOME_Q));
    const j=await r.json();
    if(j&&j[0]){
      const la=+j[0].lat,lo=+j[0].lon;
      if(Math.hypot((la-HOME.lat)*111,(lo-HOME.lon)*88)<15){   // sanity check: must be near Lakes Entrance
        HOME={lat:la,lon:lo};ls.set("wm_home",JSON.stringify(HOME));
        if(!user.real){
          user={lat:la,lon:lo,real:false};marker.setLngLat([lo,la]);
          if(!userMoved)map.jumpTo({center:[lo,la],zoom:15});
          loadWeather();
        }
        return true;
      }
    }
  }catch(e){}
  return false;
}
async function autoHomePack(){            // one-off 10 km save around home so the paper map works with no signal
  if(ls.get("wm_homepack")||!IDB.ok||!TPL||packing)return;
  await packArea({auto:true,lat:HOME.lat,lon:HOME.lon,R:10});
}

/* ---------- go ---------- */
(async function(){
  applyPalette();
  await IDB.open();
  await IDB.purgeEmpty();
  await initTpl();
  initMap();
  applyPalette();
  startGPS();
  if(!TPL)setStatus(IDB.ok?"OFFLINE · USING SAVED TILES ONLY":"NO MAP DATA · CONNECT ONCE");
  else setStatus("LOCATING…");
  // if GPS never answers, still show weather for the default spot
  setTimeout(()=>{if(!firstFix){firstFix=true;loadWeather()}},6000);
  resolveHome().then(()=>setTimeout(autoHomePack,4000));
})();
})();
