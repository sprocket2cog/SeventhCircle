<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040a06">
<title>XENO FM</title>
<style>
:root{--bg:#040a06;--panel:#08130b;--line:#1d4a2a;--fg:#a8ffb8;--dim:#4c9a60;--accent:#39ff6a;--accent2:#d4ff3a;--kw:#c9e8cf;--kb:#06150b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:11px/1.25 ui-monospace,Menlo,Consolas,"Courier New",monospace;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;width:100%;max-width:100vw;overflow:hidden;height:100vh;height:100dvh}
header{min-width:0;overflow:hidden;display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.brand{color:var(--accent);font-weight:700;letter-spacing:.18em;text-shadow:0 0 8px var(--accent)}
.brand small{color:var(--dim);font-weight:400;letter-spacing:.05em;margin-left:4px}
button,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:5px 8px;font:inherit;text-transform:uppercase;letter-spacing:.06em;touch-action:manipulation;min-height:28px}
select{text-transform:none;letter-spacing:0;max-width:100%}
button:active{background:var(--line)}
button.on{color:var(--accent);border-color:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.pbar{display:flex;align-items:center;gap:4px}
#pName{min-width:0;text-align:center;color:var(--accent2);padding:5px 6px;border:1px solid var(--line);background:var(--panel);border-radius:3px;overflow:hidden;text-overflow:ellipsis}
#scope{border:1px solid var(--line);background:#000;border-radius:3px;flex:none}
header label{color:var(--dim);display:flex;align-items:center;gap:4px}
#octLbl{min-width:26px;text-align:center;color:var(--accent2)}
main{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.15fr);min-width:0;gap:6px;padding:6px;min-height:0;overflow:hidden}
.col{touch-action:pan-y;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;padding-right:2px}
details{border:1px solid var(--line);background:var(--panel);margin-bottom:6px;border-radius:3px}
summary{padding:6px 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;cursor:pointer;list-style:none;font-size:11px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--dim)}
details[open]>summary::before{content:"▾ "}
details[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:4px 0 6px}
.row{display:grid;grid-template-columns:62px 1fr 48px;gap:6px;align-items:center;padding:1px 8px}
.row label{color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.row .v{text-align:right;color:var(--fg)}
.row.sel{grid-template-columns:62px 1fr}
.btns{display:flex;flex-wrap:wrap;gap:4px;padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px}
.chips button{padding:3px 6px;min-height:24px;font-size:10px}
#plist{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 8px 6px}
#plist button{text-align:left;text-transform:none;letter-spacing:0;padding:5px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.algos{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:4px 8px}
.algos button{text-transform:none;letter-spacing:0;padding:4px 2px;line-height:1.2;font-size:10px}
.algos button b{display:block;color:var(--dim);font-weight:400;font-size:9px;text-transform:uppercase}
.algos button.on b{color:var(--accent)}
.bpm{display:flex;align-items:center;gap:4px;padding:4px 8px}
.bpm button{padding:5px 0;flex:1;min-width:0}
#bpmv{flex:1.6;text-align:center;font-size:20px;color:var(--accent2);text-shadow:0 0 8px var(--accent2);border:1px solid var(--line);border-radius:3px;padding:2px 0;background:#00000040;position:relative}
#beat{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--line)}
#beat.f{background:var(--accent);box-shadow:0 0 8px var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-7px;box-shadow:0 0 8px var(--accent)}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--accent)}
#kbWrap{display:flex;gap:6px;padding:4px 8px 8px;height:clamp(60px,19vh,112px);border-top:1px solid var(--line);touch-action:none}
body.learn input[type=range]{pointer-events:none}body.learn button.mapped,body.learn .row.mapped{outline:1px dashed var(--accent2);outline-offset:1px}body.learn .lpend{outline:2px solid var(--accent)!important;box-shadow:0 0 10px var(--accent);animation:lp .6s infinite alternate}@keyframes lp{to{box-shadow:0 0 2px var(--accent)}}#btnLearn.on{background:var(--accent);color:#000}
.wheel{width:34px;flex:none;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;touch-action:none}
.wheel .th{position:absolute;left:2px;right:2px;height:10px;background:var(--accent);border-radius:3px;box-shadow:0 0 8px var(--accent)}
.wheel .lb{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:8px;color:var(--dim)}
#kb{flex:1;position:relative;touch-action:none}
.key{position:absolute;top:0;touch-action:none}
.wk{height:100%;background:var(--kw);border:1px solid #00000080;border-radius:0 0 4px 4px;color:#234;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.bk{height:62%;background:var(--kb);border:1px solid var(--line);border-radius:0 0 3px 3px;z-index:2}
.wk.on{background:var(--accent);color:#000}
.bk.on{background:var(--accent2)}
#midiLed{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px}
#midiLed.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
#midiLed.act{background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
#midiTxt{padding:2px 8px;color:var(--dim)}
#start{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#start h1{margin:0;color:var(--accent);letter-spacing:.3em;text-shadow:0 0 14px var(--accent);font-size:26px}
#start button{font-size:16px;padding:12px 28px;color:var(--accent);border-color:var(--accent)}
#start p{color:var(--dim);margin:0;max-width:380px}
#rot{display:none;position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--accent);align-items:center;justify-content:center;text-align:center;font-size:16px;letter-spacing:.2em;padding:20px}
@media (orientation:portrait){#rot{display:flex}}

.brand{flex:none}
#btnPanic{flex:none;border-color:var(--accent2);color:var(--accent2)}
.pbar{flex:none}
#hScroll{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;scrollbar-width:none}
#hScroll::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
#hScroll>*{flex:none}
.hArrow{flex:none;padding:4px 9px;font-size:16px;line-height:1;min-height:28px}
.hArrow.dim{opacity:.25}
.tabrow{display:flex;gap:4px;align-items:center;padding:6px 6px 2px}
.tabs{touch-action:pan-x;display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;position:relative}
.tabs button{flex:none;padding:4px 10px;min-height:26px;font-size:10px;border-radius:3px 3px 0 0;border-bottom:2px solid var(--line)}
.tabs button.on{border-bottom-color:var(--accent)}
#pSel{min-width:96px;width:118px;max-width:130px;padding:5px 2px;color:var(--accent2)}
.utools{padding:4px 8px 8px;border-top:1px solid var(--line)}
.utools input[type=text]{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:6px;font:inherit;margin-bottom:4px;user-select:text;-webkit-user-select:text}
.utools .btns{padding:3px 0}
#uMsg{color:var(--accent2);min-height:14px;padding:2px 0}
.empty{grid-column:1/-1;color:var(--dim);padding:6px 2px}

.modebar{display:flex;gap:4px;margin-bottom:6px}
.modebar button{flex:1;padding:6px 4px;border-bottom:2px solid var(--line)}
.modebar button.on{border-bottom-color:var(--accent)}
.modebar button.run{color:var(--accent2);border-color:var(--accent2)}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:2px 8px 6px}
.tlist button{text-align:left;text-transform:none;letter-spacing:0;padding:5px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbv{flex:1.6;text-align:center;font-size:18px;color:var(--accent2);text-shadow:0 0 8px var(--accent2);border:1px solid var(--line);border-radius:3px;padding:3px 0;background:#00000040}
.ledw{display:flex;align-items:center;gap:8px;padding:4px 8px}
.leds{display:flex;gap:3px;flex:1}
.led{flex:1;height:10px;background:var(--line);border-radius:2px;opacity:.7}
.led.q{opacity:1;background:color-mix(in srgb,var(--line) 60%,var(--dim))}
.led.a{background:var(--accent);box-shadow:0 0 8px var(--accent);opacity:1}
.led.ci{background:var(--accent2);box-shadow:0 0 8px var(--accent2);opacity:1}
#dPos{min-width:64px;text-align:right;color:var(--accent2)}
.dcur{padding:2px 8px 4px;color:var(--accent);letter-spacing:.06em}
.dmsg{padding:2px 8px;color:var(--accent2);min-height:14px}
.mx{display:grid;grid-template-columns:50px 1fr 1fr 28px;gap:6px;align-items:center;padding:1px 8px}
.mx.mh{color:var(--dim);font-size:9px}
.mx button{padding:2px 0;min-height:24px}
.mn{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:10px}
.mt{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.mt b{display:block;height:100%;width:0;background:var(--accent)}
@media (max-width:760px){#scope{display:none}}
body.perf .modebar,body.perf #paneP{display:none!important}
body.perf #paneD{display:block!important}
body.perf .edonly{display:none!important}
body.perf #c2>details:not(#secMacros):not(#secRec){display:none}
#secRec{display:none}body.perf #secRec{display:block;order:-1}body.perf #c2{display:flex;flex-direction:column}body.perf #c2>details{flex:none}
#secRec .rr{display:flex;flex-wrap:wrap;gap:4px;padding:3px 6px;align-items:center}#secRec .rr label{display:flex;gap:3px;align-items:center;color:var(--dim)}#secRec select{min-height:26px;padding:3px 3px}#secRec .rpos{flex:1;min-width:90px;text-align:right;color:var(--accent2)}#rRec.on{background:#ff3a3a;color:#000;border-color:#ff3a3a}#rRec.cnt{animation:lp .4s infinite alternate;background:#ff3a3a;color:#000}#rPlay.on{background:var(--accent);color:#000}.rl{display:flex;gap:4px;align-items:center;padding:2px 6px;font-size:10px}.rl .nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rl button{min-height:24px;padding:2px 6px;font-size:9px}.rl.mu{opacity:.45}.rl .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dim)}.key.pb{background:var(--pbc)!important;box-shadow:0 0 10px var(--pbc);border-color:var(--pbc)}
body.perf main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.95fr)}
body.perf #kbWrap{height:clamp(90px,28vh,160px)}
body.perf .live button{min-height:38px;font-size:12px}
body.perf #paneD summary{display:none}
body.perf #paneD .bpm,body.perf #paneD .row:not(.sel),body.perf #paneD .dcur{display:none}
body.perf #paneD details{margin-bottom:3px}
body.perf #paneD .body{padding:2px 0}
body.perf #paneD .btns{padding:2px 6px}
#btnMode{flex:none}
#btnMode.on{color:var(--accent2);border-color:var(--accent2)}
#splitWrap{border-top:1px solid var(--line);padding:3px 8px 0}
#splitBar{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
#splitBar .pz,#splitBar .pc{display:flex;align-items:center;gap:3px;min-width:0}
#splitBar button,#splitBar select{min-height:24px;padding:2px 6px;font-size:10px}
#splitBar select{max-width:104px;min-width:0;padding:2px 2px}
#splitBar .tag{min-width:34px;border-bottom:2px solid var(--line)}
#splitBar .tag.ed{border-bottom-color:var(--accent);color:var(--accent)}
#splitBar .lbl{color:var(--dim);font-size:9px;margin-left:6px}
#ocLv,#ocUv,#splLbl{min-width:22px;text-align:center;color:var(--accent2)}
#splitBar.nosplit #pcL,#splitBar.nosplit #ocLm,#splitBar.nosplit #ocLp,#splitBar.nosplit #ocLv,#splitBar.nosplit #tagL,#splitBar.nosplit #arpL{opacity:.35}
#splitStrip{position:relative;height:16px;margin:3px 0 3px 72px;border:1px solid var(--line);border-radius:3px;background:var(--panel);touch-action:none;overflow:hidden}
#zoneL,#zoneU{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:6px;font-size:9px;letter-spacing:.16em;overflow:hidden;white-space:nowrap}
#zoneL{background:color-mix(in srgb,var(--accent2) 55%,transparent);color:var(--bg)}
#zoneU{background:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--bg)}
#splitStrip.off #zoneU{background:color-mix(in srgb,var(--line) 70%,transparent);color:var(--fg)}
#splH{position:absolute;top:-1px;bottom:-1px;width:6px;margin-left:-3px;background:var(--fg);border-radius:2px;box-shadow:0 0 8px var(--fg)}
.key.zl{box-shadow:inset 0 -5px 0 var(--accent2)}
.key.zu{box-shadow:inset 0 -5px 0 var(--accent)}
</style>

<body>
<div id="rot">ROTATE TO LANDSCAPE</div>
<div id="start">
  <h1>XENO FM</h1>
  <p>4-operator FM · auto chords · arpeggiator · USB MIDI</p>
  <button id="startBtn">TAP TO START</button>
  <p>Best in landscape. Starting also asks for MIDI access.</p>
</div>
<div id="app">
  <header>
    <div class="brand">XENO FM</div>
    <button id="btnPanic">PANIC</button>
    <button id="btnMode">EDIT</button>
    <div class="pbar"><button id="pPrev">◀</button><select id="pSel"></select><button id="pNext">▶</button></div>
    <div id="hScroll">
      <canvas id="scope" width="60" height="28"></canvas>
      <label>VOL <input type="range" id="vol" min="0" max="1" step="0.01" style="width:46px"></label>
      <button id="btnLearn">LEARN</button>
      <button id="btnTheme">THEME</button>
      <button id="btnFull">FULL</button>
    </div>
  </header>
  <main>
    <div class="col" id="c1"></div>
    <div class="col" id="c2"></div>
    <div class="col" id="c3"></div>
  </main>
  <div id="splitWrap">
    <div id="splitBar">
      <div class="pz"><button id="tagL" class="tag">LOW</button><select id="pcL"></select><button id="ocLm">−</button><span id="ocLv">-1</span><button id="ocLp">+</button></div>
      <div class="pc"><button id="splOn">SPLIT</button><span id="splLbl">C4</span><span class="lbl">ARP</span><button id="arpL">LOW</button><button id="arpU">UP</button><button id="arpB">BOTH</button></div>
      <div class="pz"><button id="tagU" class="tag">UP</button><select id="pcU"></select><button id="ocUm">−</button><span id="ocUv">0</span><button id="ocUp">+</button></div>
    </div>
    <div id="splitStrip"><div id="zoneL"></div><div id="zoneU"></div><div id="splH"></div></div>
  </div>
  <div id="kbWrap">
    <div class="wheel" id="pw"><div class="th" style="top:calc((100% - 10px)*.5)"></div><div class="lb">PITCH</div></div>
    <div class="wheel" id="mw"><div class="th" style="top:calc(100% - 10px)"></div><div class="lb">MOD</div></div>
    <div id="kb"></div>
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const mtof=m=>440*Math.pow(2,(m-69)/12);
const NOTE=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK=[1,3,6,8,10];

/* ================= DATA ================= */
const ALGOS=[
 {n:'Serial',f:'4>3>2>1',mods:{0:[1],1:[2],2:[3]},car:[0]},
 {n:'Y',f:'4+3>2>1',mods:{0:[1],1:[2,3]},car:[0]},
 {n:'Dual',f:'2>1 4>3',mods:{0:[1],2:[3]},car:[0,2]},
 {n:'Fan',f:'4>1 2 3',mods:{0:[3],1:[3],2:[3]},car:[0,1,2]},
 {n:'Triple',f:'2+3+4>1',mods:{0:[1,2,3]},car:[0]},
 {n:'Stack+1',f:'4>3>1 +2',mods:{0:[2],2:[3]},car:[0,1]},
 {n:'Additive',f:'1+2+3+4',mods:{},car:[0,1,2,3]},
 {n:'Duo+2',f:'2>1 +3 +4',mods:{0:[1]},car:[0,2,3]}
];
const CHORDS={off:null,major:[0,4,7],minor:[0,3,7],'7th':[0,4,7,10],maj7:[0,4,7,11],min7:[0,3,7,10],sus2:[0,2,7],sus4:[0,5,7],power:[0,7,12],dim:[0,3,6],aug:[0,4,8],add9:[0,4,7,14],scale3:'s3',scale7:'s7'};
const CHORD_LBL={off:'Off (single notes)',major:'Major',minor:'Minor','7th':'Dominant 7th',maj7:'Major 7th',min7:'Minor 7th',sus2:'Sus 2',sus4:'Sus 4',power:'Power',dim:'Diminished',aug:'Augmented',add9:'Add 9',scale3:'Scale triads',scale7:'Scale 7ths'};
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10],phrygian:[0,1,3,5,7,8,10],'harmonic minor':[0,2,3,5,7,8,11],'pentatonic minor':[0,3,5,7,10]};
const RATES={'1/4':1,'1/8':.5,'1/8t':1/3,'1/16':.25,'1/16t':1/6,'1/32':.125};
const EDIV={'1/4':1,'1/4d':1.5,'1/8d':.75,'1/8':.5,'1/8t':1/3,'1/16':.25};
const PRESETS=[],CATS=[];
function add(cat,name,algo,ops,rev,echo,cut,wob){PRESETS.push({cat,name,algo,ops,rev:rev??.2,echo:echo??0,cut:cut??1,wob:wob??0});if(!CATS.includes(cat))CATS.push(cat);}
/* op = [ratio, level, attack, decay, sustain, release] */
// KEYS
add('Keys','DX Tines',2,[[1,.85,.002,2.2,0,.5],[1,.32,.002,1.2,0,.4],[1,.45,.002,2.8,0,.5],[14,.28,.001,.12,0,.1]],.25);
add('Keys','Soft EP',2,[[1,.8,.003,2.5,0,.6],[1,.22,.003,1.5,0,.5],[1,.4,.003,3,0,.6],[7,.1,.001,.2,0,.1]],.3);
add('Keys','Wurly',2,[[1,.8,.003,1.4,.1,.3],[2,.38,.002,.7,.1,.2],[1,.35,.003,1.4,.1,.3],[1,.45,.002,.4,.1,.2]],.15);
add('Keys','Clav',2,[[1,.8,.001,.5,.1,.08],[3,.5,.001,.2,.05,.06],[2,.45,.001,.4,.1,.08],[4,.4,.001,.15,.05,.06]],.1,0,.9);
add('Keys','Glass Piano',1,[[1,.85,.002,2.4,0,.6],[1,.4,.002,1.6,0,.4],[2,.3,.002,.6,0,.2],[5,.2,.001,.1,0,.1]],.3);
add('Keys','Upright Piano',2,[[1,.85,.001,2.8,0,.4],[1,.35,.001,1,0,.3],[1,.3,.001,2,0,.4],[3,.35,.001,.08,0,.08]],.2);
add('Keys','Drawbar Organ',6,[[1,.5,.01,.1,1,.07],[2,.4,.01,.1,1,.07],[3,.3,.01,.1,1,.07],[4,.22,.01,.1,1,.07]],.15,0,1,.1);
add('Keys','Church Organ',6,[[.5,.45,.03,.1,1,.25],[1,.4,.03,.1,1,.25],[2,.3,.03,.1,1,.25],[4,.2,.03,.1,1,.25]],.6);
add('Keys','Rock Organ',7,[[1,.55,.005,.1,1,.06],[2,.25,.005,.1,1,.06],[3,.4,.005,.1,1,.06],[6,.2,.005,.1,1,.06]],.15,0,1,.05);

/* ================= AUDIO GRAPH ================= */
function initAudio(){

let irT=null;

function makeIR(){

function applyCutoff(){if(!ctx)return;for(let p=0;p<N.lps.length;p++)N.lps[p].frequency.setTargetAtTime(100*Math.pow(160,pst(p).cutoff===undefined?1:pst(p).cutoff),ctx.currentTime,.03);}

/* ================= VOICES ================= */
function noteOn(m,vel,t,pan,part){

 const bm=Math.pow(4,(st.macro.bright-.5)*2),pa=Math.pow(3,(.5-st.macro.punch)*2),pd=Math.pow(4,(.5-st.macro.punch)*2),rm=Math.pow(8,(st.macro.rel-.5)*2);
 const modSet=new Set();Object.values(al.mods).forEach(a=>a.forEach(i=>modSet.add(i)));
 const v={oscs:[],gains:[],R:[],det:[],rel:false,m:m,n:0,lfo:false,part:part};
 for(let i=0;i<4;i++)if(op[i].l>.002)v.n++;
 if(v.n===0)return null;
 v.out=c.createGain();v.pan=c.createStereoPanner();v.pan.pan.value=clamp(pan||0,-1,1);
 v.out.connect(v.pan);v.pan.connect(N.vb[part]);
 for(let i=0;i<4;i++){
  const o=op[i];
  v.R.push(Math.max(.03,o.rl*rm));v.det.push(o.det||0);
  if(o.l<=.002){v.oscs.push(null);v.gains.push(null);continue;}
  const osc=c.createOscillator();
  osc.frequency.value=f*o.r;osc.detune.value=(o.det||0)+S.bendC;
  const g=c.createGain();g.gain.value=0;osc.connect(g);
  v.oscs.push(osc);v.gains.push(g);
  let peak,A,D;
  if(modSet.has(i)){peak=o.l*o.l*10*bm*(.4+.6*vel)*f*o.r;A=Math.max(.002,o.a*pa);D=Math.max(.01,o.d*pd);}

  const gp=g.gain;gp.setValueAtTime(0,t);gp.linearRampToValueAtTime(peak,t+A);gp.setTargetAtTime(peak*o.s,t+A,D/3);
 }
 al.car.forEach(i=>{if(v.gains[i])v.gains[i].connect(v.out);});
 for(const k in al.mods)al.mods[k].forEach(mi=>{if(v.gains[mi]&&v.oscs[k])v.gains[mi].connect(v.oscs[k].frequency);});
 v.oscs.forEach(o=>{if(o)o.start(t);});
 if(st.wobble+S.mod>0)lfoAttach(v);
 const first=v.oscs.find(o=>o);
 first.onended=()=>{
  v.oscs.forEach((o,i)=>{
   if(!o)return;
   if(v.lfo){try{N.lfoGs[v.part].disconnect(o.detune);}catch(e){}}
   try{o.disconnect();v.gains[i].disconnect();}catch(e){}
  });
  try{v.out.disconnect();v.pan.disconnect();}catch(e){}
  const k=voices.indexOf(v);if(k>=0)voices.splice(k,1);

 voices.push(v);
 let live=voices.filter(x=>!x.rel),tot=live.reduce((a,x)=>a+x.n,0);
 while(tot>S.maxOsc&&live.length>1){const o=live.shift();tot-=o.n;relVoice(o,true);}

}
function lfoAttach(v){

}
function applyBend(tc){
 if(!ctx)return;const now=ctx.currentTime;
 voices.forEach(v=>{if(v.rel)return;v.oscs.forEach((o,i)=>{if(o)o.detune.setTargetAtTime(v.det[i]+S.bendC,now,tc);});});
}
function relVoice(v,fast){
 if(!v||v.rel)return;v.rel=true;
 if(v._rec&&recOff)recOff(v);
 const now=ctx.currentTime;let maxR=0;
 v.gains.forEach((g,i)=>{
  if(!g)return;

}
function panic(){

/* ================= CHORDS ================= */
function chordNotes(m){
 const type=S.chord.type;let c;
 if(type==='off')return [m];
 const def=CHORDS[type];
 if(def==='s3'||def==='s7'){
  const sc=SCALES[S.chord.scale],len=sc.length,r=S.chord.root;
  const rel=(((m-r)%12)+12)%12,base=m-rel;
  let idx=0;for(let k=0;k<len;k++)if(sc[k]<=rel)idx=k;
  const deg=k=>base+sc[k%len]+12*Math.floor(k/len);
  c=def==='s3'?[0,2,4].map(o=>deg(idx+o)):[0,2,4,6].map(o=>deg(idx+o));
 }else c=def.map(i=>m+i);
 const vo=S.chord.voicing;
 if(vo==='open'&&c.length>=3){c[1]+=12;}
 else if(vo==='spread'&&c.length>=3){c=[c[0]-12,c[1],c[2]+12].concat(c.slice(3));}
 c.sort((a,b)=>a-b);
 return c.map(n=>clamp(n,0,127));
}
function panFor(j,n){
 const w=S.fx.width;
 if(n>1)return ((j/(n-1))*2-1)*w*.8+(Math.random()-.5)*.1;
 return (Math.random()-.5)*2*w*.3;
}

/* ================= KEY HANDLING ================= */
function partOf(m){return SPL.on&&m<SPL.at?0:1;}

 litc[m]=(litc[m]||0)+(on?1:-1);if(litc[m]<0)litc[m]=0;

function chordFor(p){const t=S.chord.part;return !SPL.on||t==='both'||(t==='lower'&&p===0)||(t==='upper'&&p===1);}
function keyDown(midi,vel,id){
 if(!ctx)return;

  const hold=S.arp.latch||S.sustain;
  if(hold&&!Object.values(held).some(x=>x.part===p))P.pool=[];

  P.pool.push(...notes);

}

}

  PT.forEach((P,p)=>{if(P.arp&&!S.arp.latch)rebuildPool(p);});

/* ================= ARPEGGIATOR ================= */
let arpTimer=null;
/* lock-step: the arp grid is pinned to the drum bar when drums run, else to the other part's grid */
function arpSnap(P,stepDur,fresh){
 if(!ctx)return;
 let a=null,extra=0;
 if(DR.on&&DR.bar){
  const bl=16*15/S.bpm,k=Math.floor((P.arpNext-DR.bar.t)/bl+1e-4);a=DR.bar.t+k*bl;
 }else{
  const o=PT[P===PT[0]?1:0];
  if(o.arp&&o.pool.length&&o.arpNext>ctx.currentTime-.2){a=o.arpNext;extra=o.arpStep;}
 }
 if(a===null)return;
 let n=(P.arpNext-a)/stepDur;n=fresh?Math.ceil(n-1e-3):Math.round(n);
 const tg=a+n*stepDur;
 if(fresh||Math.abs(tg-P.arpNext)<stepDur*.5){P.arpNext=tg;if(fresh)P.arpStep=n+extra;}
}
function arpTick(){
 if(!ctx)return;
 const stepDur=60/S.bpm*RATES[S.arp.rate];
 for(let p=0;p<2;p++){
  const P=PT[p];if(!P.arp)continue;
  if(P.pool.length===0){P.arpNext=ctx.currentTime+.02;P.arpStep=0;P.arpFresh=true;continue;}
  while(P.arpNext<ctx.currentTime+.12){
   arpSnap(P,stepDur,P.arpFresh);P.arpFresh=false;
   if(P.arpNext>=ctx.currentTime+.12)break;
   const t=P.arpNext+((P.arpStep&1)?S.arp.swing*stepDur*.5:0);
   playArpStep(p,Math.max(t,ctx.currentTime),stepDur);
   P.arpNext+=stepDur;P.arpStep++;
  }
 }
}
function playArpStep(p,t,stepDur){

 const u=[...new Set(P.pool)].sort((a,b)=>a-b),ord=[...new Set(P.pool)],pat=S.arp.pat,oc=S.arp.oct;
 const base=pat==='asplayed'?ord:u;
 let full=[];for(let o=0;o<oc;o++)base.forEach(n=>full.push(n+12*o));

 if(pat==='chord')notes=u.map(n=>n+12*(arpStep%oc));

 else{
  let seq=full;
  if(pat==='down')seq=full.slice().reverse();

  const dly=Math.max(0,(t+gate-ctx.currentTime)*1000);

function flash(n,t,gate){

function beat(t){

function setArpPart(p,on){

 if(on){
  rebuildPool(p);P.arpNext=ctx?ctx.currentTime+.02:0;P.arpStep=0;P.arpFresh=true;

/* ================= RECORDER ================= */
const RC={pb:{},mode:'idle',rec:false,zero:0,cursor:0,from:0,startAt:0,recFrom:0,recTo:Infinity,timer:null,ui:null,timers:new Set(),open:new Set(),pass:null,takes:[],ti:-1,ci:0,replaying:false};

function rcSlotApply(sl,st,at){const p=2+sl,d=Math.min(1,(st.wobble||0)+S.mod);N.lps[p].frequency.setTargetAtTime(100*Math.pow(160,st.cutoff===undefined?1:st.cutoff),at,.01);N.lfoGs[p].gain.setTargetAtTime(d*d*100,at,.01);if(d>0)voices.forEach(v=>{if(!v.rel&&v.part===p)lfoAttach(v);});}

  if(L.kind==='n'){
   const sl=L._slot;if(sl===undefined||sl>=8)return;
   const a=L.notes;let i=L._i||0;
   while(L.pp&&(L._pi||0)<L.pp.length&&L.pp[L._pi][0]<hi){const e=L.pp[L._pi++];const at=z+e[0];
    rcLater(()=>{const p=2+sl;if(e[1]==='cutoff')N.lps[p].frequency.setTargetAtTime(100*Math.pow(160,e[2]),ctx.currentTime,.03);else{const d=Math.min(1,e[2]+S.mod);N.lfoGs[p].gain.setTargetAtTime(d*d*100,ctx.currentTime,.03);if(d>0)voices.forEach(v=>{if(!v.rel&&v.part===p)lfoAttach(v);});}},at);}
   while(i<a.length&&a[i][0]<hi){
    const n=a[i++],at=z+n[0],pt=L.patches[n[4]]||L.patches[0];
    if(L._cp!==n[4]){LP[sl].st=pt.st;rcSlotApply(sl,pt.st,at);L._cp=n[4];}
    const v=noteOn(n[2],n[3],at,(Math.random()-.5)*S.fx.width,2+sl);
    if(v)rcLater(()=>relVoice(v),at+n[1]);
    rcLater(()=>rcPb(n[2],sl,1),at);rcLater(()=>rcPb(n[2],sl,0),at+n[1]);
   }
   L._i=i;
  }else{
   const a=L.ev;let i=L._i||0;
   while(i<a.length&&a[i][0]<hi){const e=a[i++];if(window.drumHit)window.drumHit(e[1],e[2],e[3],z+e[0]);}
   L._i=i;
  }
 });
 while(RC.ci<tk.ctl.length&&tk.ctl[RC.ci][0]<hi){const e=tk.ctl[RC.ci++];rcLater(()=>rcApplyCtl(e[1],e[2]),z+e[0]);}
}
const RC_COL=['#ff7a3a','#3acbff','#ff3ad4','#ffd23a','#9a6bff','#3affb0','#ff5a5a','#c8ff3a'];
function rcPb(m,sl,on){
 const i=m-KB_BASE;if(i<0||i>=keyEls.length)return;
 const o=RC.pb[i]||(RC.pb[i]={});o[sl]=Math.max(0,(o[sl]||0)+(on?1:-1));
 let top=-1;for(let k=7;k>=0;k--)if(o[k]>0){top=k;break;}
 const el=keyEls[i];
 if(top<0){el.classList.remove('pb');el.style.removeProperty('--pbc');}
 else{el.classList.add('pb');el.style.setProperty('--pbc',RC_COL[top]);}
}
function rcPbClear(){RC.pb={};keyEls.forEach(e=>{e.classList.remove('pb');e.style.removeProperty('--pbc');});}
function rcClick(at,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1600:1100;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.22,at+.002);g.gain.exponentialRampToValueAtTime(.001,at+.05);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.07);}
function rcStart(rec){
 if(!ctx)return;
 let tk=rcTake();if(!tk)tk=rcNew();
 if(RC.mode!=='idle'){
  if(rec&&!RC.rec&&RC.mode==='run')rcPunchIn();
  else if(rec&&RC.rec)rcPunchOut();
  return;
 }
 if(rec&&tk.layers.filter(L=>L.kind==='n').length>6){alert('8 note layers is the limit. Delete a layer first.');return;}
 if(tk.layers.length){if(Math.abs(S.bpm-tk.bpm)>.01)setBpm(tk.bpm);}else tk.bpm=+(+S.bpm).toFixed(2);
 const bt=60/tk.bpm,bs=bt*4,cnt=rec?+$('#rCnt').value:0,pre=+$('#rPre').value,inB=Math.max(1,+$('#rIn').value),outB=+$('#rOut').value;
 const from=Math.max(0,(inB-1-pre)*bs);
 let startAt=ctx.currentTime+.15+cnt*4*bt;
 if(DR.on&&DR.bar){startAt=DR.bar.t+Math.ceil((startAt-DR.bar.t)/bs-1e-6)*bs;}
 RC.zero=startAt-from;RC.cursor=from;RC.from=from;RC.startAt=startAt;
 RC.recFrom=rec?(inB-1)*bs:0;RC.recTo=(rec&&outB>0)?outB*bs:Infinity;
 RC.mode='count';RC.rec=false;RC.pass=null;RC.open.clear();
 if(rec)rcBeginPass(tk,RC.recFrom);
 RC.rec=rec;
 rcSeek(tk,from);
 for(let j=0;j<cnt*4;j++)rcClick(startAt-(cnt*4-j)*bt,j%4===0);
 clearInterval(RC.timer);RC.timer=setInterval(rcTick,25);rcTick();
 rcUi();
}
function rcBeginPass(tk,start){tk.pass++;RC.pass={p:[null,null],drum:[],ctl:[],start:start};}
function rcPB(part){const P=RC.pass.p;if(!P[part])P[part]={patches:[],last:'',notes:[],pp:[]};return P[part];}
function rcPunchIn(){
 const tk=rcTake();if(tk.layers.filter(L=>L.kind==='n').length>6){alert('8 note layers is the limit. Delete a layer first.');return;}
 const pos=rcPos();RC.recFrom=pos;RC.recTo=+$('#rOut').value>0?+$('#rOut').value*240/tk.bpm:Infinity;
 if(RC.recTo<=pos)RC.recTo=Infinity;
 rcBeginPass(tk,pos);RC.rec=true;rcUi();
}
function rcPunchOut(){RC.rec=false;rcFinal();rcUi();}
function rcFinal(){
 const pass=RC.pass;if(!pass)return;RC.pass=null;
 const tk=rcTake(),end=ctx.currentTime-RC.zero;
 [...RC.open].forEach(v=>recOff(v));RC.open.clear();
 let added=0;
 [0,1].forEach(part=>{const pb=pass.p[part];if(!pb||!pb.notes.length)return;
  const names=[...new Set(pb.patches.map(x=>x.name))];
  tk.layers.push({kind:'n',part,name:(part?'U':'L')+tk.pass+' '+names[0],inst:names.join(' › '),patches:pb.patches,notes:pb.notes.sort((a,b)=>a[0]-b[0]),pp:pb.pp.sort((a,b)=>a[0]-b[0]),mute:false});added++;});
 if(pass.drum.length){tk.layers.push({kind:'d',name:'D'+tk.pass+' DRUMS',inst:'drum hits',ev:pass.drum.sort((a,b)=>a[0]-b[0]),mute:false});added++;}
 if(pass.ctl.length){const ks=new Set(pass.ctl.map(e=>e[1]));tk.ctl=tk.ctl.filter(e=>!(ks.has(e[1])&&e[0]>=pass.start&&e[0]<=end)).concat(pass.ctl).sort((a,b)=>a[0]-b[0]);added++;}
 if(!added)tk.pass--;
 rcSlots(tk);rcLen(tk);
 if(RC.mode!=='idle'){const c=RC.cursor;tk.layers.forEach(L=>{if(L._i===undefined){const a=L.kind==='n'?L.notes:L.ev;let i=0;while(i<a.length&&a[i][0]<c)i++;L._i=i;L._pi=L.pp?L.pp.length:0;L._cp=-1;}});let q=0;while(q<tk.ctl.length&&tk.ctl[q][0]<c)q++;RC.ci=q;}
 rcSaveTakes();rcRender();
}
function rcStop(){
 if(RC.mode==='idle')return;
 clearInterval(RC.timer);RC.timer=null;
 if(RC.pass)rcFinal();
 const tk=rcTake();
 RC.mode='idle';RC.rec=false;
 RC.timers.forEach(clearTimeout);RC.timers.clear();rcPbClear();
 voices.filter(v=>v.part>=2).forEach(v=>relVoice(v,true));
 if(tk&&tk.ctl.some(e=>e[1]==='bend')){RC.replaying=true;setBend(0);RC.replaying=false;}
 if(tk&&tk.ctl.some(e=>e[1]==='mod')){RC.replaying=true;setMod(0);RC.replaying=false;}
 rcUi();
}
window.recStop=rcStop;
function rcTick(){
 const tk=rcTake();if(!tk||!ctx){rcStop();return;}
 const now=ctx.currentTime;
 if(RC.mode==='count'&&now>=RC.startAt)RC.mode='run';
 const hi=now+.15-RC.zero;
 if(hi>RC.cursor){rcSched(tk,hi);RC.cursor=hi;}
 const pos=now-RC.zero;
 if(RC.mode==='run'){
  if(RC.rec&&pos>=RC.recTo)rcPunchOut();
  if(!RC.rec&&pos>tk.len+1.2){rcStop();return;}
 }
}
recOn=(v,m,vel,t,part)=>{
 if(!RC.rec||RC.mode!=='run'||!RC.pass)return;
 const tt=t-RC.zero;if(tt<RC.recFrom||tt>=RC.recTo)return;
 const pb=rcPB(part),P=PT[part],j=JSON.stringify(P.st);
 if(j!==pb.last){pb.last=j;const pr=ALL()[P.pi];pb.patches.push({st:JSON.parse(j),name:pr?pr.name:'?'});}
 const e=[+tt.toFixed(4),0,m,+vel.toFixed(3),pb.patches.length-1];
 pb.notes.push(e);v._rec=e;RC.open.add(v);
};
recOff=v=>{const e=v._rec;if(!e)return;v._rec=null;RC.open.delete(v);const d=ctx.currentTime-RC.zero-e[0];e[1]=+Math.max(.03,Math.min(d,RC.recTo-e[0])).toFixed(4);};
recCtl=(k,v)=>{
 if(!RC.rec||RC.mode!=='run'||RC.replaying||!RC.pass)return;
 const tt=ctx.currentTime-RC.zero;if(tt<RC.recFrom||tt>=RC.recTo)return;
 RC.pass.ctl.push([+tt.toFixed(4),k,+(+v).toFixed(4)]);
};
window.recDrum=(c,vi,v,tt)=>{
 if(!RC.rec||RC.mode!=='run'||!RC.pass)return;
 const t=tt-RC.zero;if(t<RC.recFrom||t>=RC.recTo)return;
 RC.pass.drum.push([+t.toFixed(4),c,vi,Math.round(v)]);
};
document.addEventListener('input',e=>{
 if(RC.replaying||!RC.rec||RC.mode!=='run'||!RC.pass)return;

 else if(el.closest('#secMacros')){
  const lb=el.closest('.row').querySelector('label').textContent,f={Wobble:'wobble',Filter:'cutoff'}[lb];
  if(f){const tt=ctx.currentTime-RC.zero;if(tt>=RC.recFrom&&tt<RC.recTo&&PT[EP]){rcPB(EP).pp.push([+tt.toFixed(4),f,+el.value]);}}
 }
},true);

function rcDl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);}
function rcFile(tk){return (tk.name||'take').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'take';}
function rcMidi(tk){
 const PPQ=480,tps=PPQ*tk.bpm/60,T=s=>Math.max(0,Math.round(s*tps));
 const vlq=n=>{const b=[n&127];while((n>>=7)>0)b.unshift((n&127)|128);return b;};
 const str=s=>[...unescape(encodeURIComponent(s))].map(c=>c.charCodeAt(0));
 const be=(n,l)=>{const o=[];for(let i=l-1;i>=0;i--)o.push((n>>(8*i))&255);return o;};
 const trk=ev=>{ev.sort((a,b)=>a[0]-b[0]||a[2]-b[2]);const o=[];let last=0;ev.forEach(e=>{vlq(e[0]-last).forEach(x=>o.push(x));e[1].forEach(x=>o.push(x));last=e[0];});[0,0xFF,0x2F,0].forEach(x=>o.push(x));return o;};
 const nm=s=>{const b=str(s);return [0xFF,0x03,b.length].concat(b);};
 const mpq=Math.round(60e6/tk.bpm),chunks=[];
 chunks.push(trk(tk.ctl.filter(e=>e[1].slice(0,3)==='mk:').map(e=>{const b=str(e[1].slice(3));return [T(e[0]),[0xFF,0x06,b.length].concat(b),1];}).concat([[0,nm(tk.name||'XENO FM'),0],[0,[0xFF,0x51,3,(mpq>>16)&255,(mpq>>8)&255,mpq&255],0],[0,[0xFF,0x58,4,4,2,24,8],0]])));
 let ch=0;
 tk.layers.forEach(L=>{
  const ev=[[0,nm(L.name+(L.inst?' ['+L.inst+']':'')),0]];
  if(L.kind==='n'){
   if(ch===9)ch++;const c=ch++&15;
   L.notes.forEach(n=>{const a=T(n[0]),b=Math.max(a+1,T(n[0]+n[1]));ev.push([a,[0x90|c,n[2]&127,Math.max(1,Math.min(127,Math.round(n[3]*127)))],1],[b,[0x80|c,n[2]&127,0],0]);});
   tk.ctl.forEach(e=>{if(e[1]==='bend'){const v=Math.max(0,Math.min(16383,8192+Math.round(e[2]*8191)));ev.push([T(e[0]),[0xE0|c,v&127,v>>7],1]);}else if(e[1]==='mod')ev.push([T(e[0]),[0xB0|c,1,Math.round(e[2]*127)],1]);});
  }else{
   L.ev.forEach(e=>{const a=T(e[0]),n=window.drumNote?window.drumNote(e[1]):38;ev.push([a,[0x99,n&127,Math.max(1,Math.min(127,e[3]))],1],[a+Math.round(tps*.09),[0x89,n&127,0],0]);});
  }
  chunks.push(trk(ev));
 });
 let out=[...str('MThd'),...be(6,4),...be(1,2),...be(chunks.length,2),...be(PPQ,2)];
 chunks.forEach(c=>{out=out.concat(str('MTrk'),be(c.length,4),c);});
 return new Blob([new Uint8Array(out)],{type:'audio/midi'});
}

/* ================= MIDI LEARN ================= */
let LMAP={},learnOn=false,learnTgt=null,learnCache=new Map();
try{LMAP=JSON.parse(localStorage.getItem('xenoLearn')||'{}')||{};}catch(e){LMAP={};}
function lSave(){try{localStorage.setItem('xenoLearn',JSON.stringify(LMAP));}catch(e){}}
function lKey(el){
 if(el.id)return el.id;
 if(el.type==='range'){const r=el.closest('.row'),l=r&&r.querySelector('label');return 'rng:'+(l?l.textContent.trim():'?')+':'+(r?[...r.parentNode.children].indexOf(r):0);}
 const sm=el.closest('details'),h=sm&&sm.querySelector('summary');
 return 'btn:'+(h?h.textContent.trim().slice(0,14):'')+':'+el.textContent.trim().slice(0,16);
}
function lEl(key){
 let el=learnCache.get(key);if(el&&el.isConnected)return el;
 for(const c of document.querySelectorAll('button,input[type=range]')){if(c.closest('#kb'))continue;if(lKey(c)===key){learnCache.set(key,c);return c;}}
 return null;
}
function lTarget(e){
 let t=e.target;if(!t||!t.closest)return null;
 let el=t.closest('button');
 if(!el){const row=t.closest('.row');el=row&&row.querySelector('input[type=range]');}
 if(!el||el.id==='btnLearn'||el.closest('#kb'))return null;
 return el;
}
function lMark(){
 document.querySelectorAll('.mapped').forEach(x=>x.classList.remove('mapped'));
 for(const k in LMAP){const el=lEl(k);if(el)(el.type==='range'?el.closest('.row')||el:el).classList.add('mapped');}
}
function lPendMark(on){
 document.querySelectorAll('.lpend').forEach(x=>x.classList.remove('lpend'));
 if(on&&learnTgt)(learnTgt.type==='range'?learnTgt.closest('.row')||learnTgt:learnTgt).classList.add('lpend');
 const b=$('#btnLearn');b.textContent=!learnOn?'LEARN':(learnTgt?'MOVE KNOB':'PICK CTRL');
}
function setLearn(on){
 learnOn=on;learnTgt=null;document.body.classList.toggle('learn',on);$('#btnLearn').classList.toggle('on',on);
 if(on)lMark();else document.querySelectorAll('.mapped').forEach(x=>x.classList.remove('mapped'));
 lPendMark(on);
}
function learnMidi(cmd,ch,d1,d2){
 if(cmd!==0xB0&&!(cmd===0x90&&d2>0))return false;
 const type=cmd===0xB0?'cc':'note';
 if(learnOn&&learnTgt){
  const k=lKey(learnTgt);
  for(const q in LMAP){if(LMAP[q].t===type&&LMAP[q].n===d1&&LMAP[q].c===ch)delete LMAP[q];}
  LMAP[k]={t:type,n:d1,c:ch};lSave();learnTgt=null;lMark();lPendMark(true);return true;
 }
 if(learnOn)return false;
 let hit=false;
 for(const k in LMAP){
  const m=LMAP[k];if(m.t!==type||m.n!==d1||m.c!==ch)continue;
  const el=lEl(k);if(!el)continue;hit=true;
  if(el.type==='range'){
   if(type==='cc'){const mn=+el.min,mx=+el.max,st=+el.step||0;let v=mn+(mx-mn)*d2/127;if(st)v=Math.round(v/st)*st;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  }else if(type==='note'||d2>=64){

/* ---- live (endless) director: makes the next bar on demand, main thread only ---- */
const LIVE_V=[{n:'TIGHT',mut:0,fill:0,loop:1},{n:'MILD',mut:.25,fill:.2,useD:0},{n:'WILD',mut:.6,fill:.45,useD:1},{n:'MAD',mut:1,fill:.7,useD:1,rnd:1}];
const LIVE_GEN={rock:genRock,techno:genTechno,trance:genTrance,blade:genBlade,breaks:genBreaks};
function liveNew(style,energy,vi){
 return {style:style,energy:energy,vi:vi,R:drumRng((Math.random()*4294967296)>>>0),chunk:[],ci:0,hold:false,last:null,brk:false,build:0,fillN:false,dropN:false,n:0};
}
function liveChunk(D){
 const R=D.R,V=LIVE_V[D.vi];
 let en=D.energy;
 if(V.rnd)en=3+Math.floor(R()*7);else if(D.vi>=2)en=Math.max(1,Math.min(9,D.energy+Math.floor(R()*3)-1));
 const G=LIVE_GEN[D.style]||genRock;
 let bars=G(drumRng(1+Math.floor(R()*999999999)),{style:D.style,energy:en,fills:V.fill*100,bars:16,extra:{}});
 const keep=bars.filter(L=>L.k!=='I'&&(V.useD||L.k!=='D'));
 bars=keep.length?keep:bars;
 if(V.loop){const a=bars.find(L=>L.k==='A')||bars[0],b=bars.find(L=>L.k==='B')||a;bars=[a,a,a,b];}
 D.chunk=bars;D.ci=0;
}
function liveBase(D){
 if(D.hold&&D.last)return D.last.slice();
 if(D.ci>=D.chunk.length){if(D.vi===0&&D.chunk.length)D.ci=0;else liveChunk(D);}
 const L=D.chunk[D.ci++].slice();D.last=L.slice();return L;
}
function liveMutate(L,R,a){
 L=L.slice();
 let h=L[2];for(let i=0;i<16;i++)if(R()<a*.12)h=setAt(h,i,h[i]==='.'?'H':'.');
 L[2]=h;
 L[5]=addRand(L[5],'g',a*.10,R,[2,3,6,7,10,11,14,15]);
 if(R()<a*.35)L[4]=addRand(L[4],'123'[Math.floor(R()*3)],a*.12,R,[10,11,12,13,14,15]);
 L[3]=addRand(L[3],'O',a*.08,R,[2,6,10,14]);
 const kc=(L[0].match(/[KD]/)||[''])[0];if(kc)L[0]=addRand(L[0],kc,a*.08,R,[3,7,11,15]);
 return L;
}
function lanesToSteps(L){const o=[];for(let s=0;s<16;s++)o.push(L[0][s]+L[1][s]+L[2][s]+L[3][s]+L[4][s]+L[5][s]);return o;}
function liveNext(D){
 const R=D.R,V=LIVE_V[D.vi];
 let L=liveBase(D),st='GROOVE';
 const kick=(L[0].match(/[KDB]/)||['K'])[0];
 if(D.dropN){
  D.dropN=false;D.brk=false;D.build=0;L=L.slice();
  L[3]=setAt(L[3],0,'C');if(L[0][0]==='.')L[0]=setAt(L[0],0,kick);st='DROP';
 }else if(D.build>0){
  const n=4-D.build,f=n/3;L=L.slice();
  L[0]=E16;L[4]=E16;
  L[1]=f<.34?'S...S...S...S...':f<.67?'S.S.S.S.S.S.S.S.':'SSSSSSSSSSSSSSSS';
  if(D.build===1){L[3]=setAt(E16,5,'Z');D.dropN=true;}
  D.build--;st='BUILD '+(n+1)+'/4';
 }else if(D.brk){
  L=L.slice();L[0]=E16;L[1]=E16;L[4]=E16;
  L[2]=L[2].split('').map((c,i)=>i%4===2?c:'.').join('');
  if(D.fillN){L=fillBar(L,R);D.fillN=false;st='FILL';}else st='BREAK';
 }else if(D.hold){
  st='HOLD';if(D.fillN){L=fillBar(L,R);D.fillN=false;st='FILL';}
 }else{
  if(V.mut)L=liveMutate(L,R,V.mut);
  if(D.fillN){L=fillBar(L,R);D.fillN=false;st='FILL';}
  else if(V.fill&&D.n%4===3&&R()<V.fill*1.3){L=fillBar(L,R);st='FILL';}
  else if(V.rnd&&D.n%2===1&&R()<V.fill*.6){L=fillBar(L,R);st='FILL';}
 }
 D.n++;
 return {steps:lanesToSteps(L),state:st};
}

const MAP={K:{n:36,v:112},D:{n:35,v:116},B:{n:34,v:118},S:{n:38,v:108},g:{n:38,v:42},P:{n:39,v:104},
 '1':{n:50,v:98},'2':{n:47,v:98},'3':{n:45,v:98},T:{n:43,v:100},H:{n:42,v:74},O:{n:46,v:86},C:{n:49,v:110},

/* ================= BUILT-IN KITS (synthesised) ================= */
const KITS={
 '808':{k:{f0:155,f1:46,sw:.11,dec:.8,clk:0,sat:1},s:{tf:180,td:.11,nd:.24,hp:1600,tv:.55,nv:.65},h:{mt:1,hp:7500,bp:10000,dec:.05,odec:.34},t:[205,152,113,84],td:.5,cr:1.1,clap:1100,rim:1700,g:{S:.6,g:.6,P:2.5,H:4,O:3.5,s:3,r:.7,Z:1.5}},
 '909':{k:{f0:235,f1:52,sw:.07,dec:.45,clk:1,sat:3},s:{tf:215,td:.09,nd:.2,hp:1900,tv:.5,nv:.8},h:{mt:1,hp:8200,bp:11500,dec:.04,odec:.28},t:[212,160,120,90],td:.34,cr:1.5,clap:1300,rim:1900,g:{S:.5,g:.5,P:2,H:5,O:4.5,s:3,r:.7,Z:1.4}},
 'ROCK':{k:{f0:125,f1:58,sw:.05,dec:.3,clk:1,sat:1},s:{tf:195,td:.15,nd:.2,hp:900,bp:2600,tv:.75,nv:.55},h:{mt:0,hp:6500,bp:9000,dec:.06,odec:.42},t:[178,132,98,72],td:.38,cr:1.7,clap:1000,rim:1500,g:{S:.55,g:.55,P:2.6,H:2.2,O:1.6,s:3.4,r:.7,Z:1.5}}
};
const MET=[205.3,304.4,369.6,522.7,540,800];
function nz(t,dur){const s=ctx.createBufferSource();s.buffer=DB.noise;s.loop=true;s.start(t,Math.random()*1.5);s.stop(t+dur);return s;}
function env(out,t,peak,dec,att){const g=ctx.createGain();att=att||.001;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(Math.max(peak,.0002),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec);g.connect(out);return g;}
function bq(type,f,q){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;}
function sat(k){const n=256,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*k)/Math.tanh(k);}return c;}
const SAT={};function satCurve(k){return SAT[k]||(SAT[k]=sat(k));}
function osc(type,f,t,dur){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(t+dur);return o;}
function dKick(out,t,v,K,mode){
 const deep=mode==='D',boom=mode==='B';
 const f0=boom?70:K.f0*(deep?.82:1),f1=boom?34:K.f1*(deep?.8:1),dec=boom?1.3:K.dec*(deep?1.2:1),sw=boom?.25:K.sw;
 const o=osc('sine',f0,t,dec+.08);o.frequency.exponentialRampToValueAtTime(f1,t+sw);
 const g=env(out,t,v,dec,.002);
 if(K.sat>1){const w=ctx.createWaveShaper();w.curve=satCurve(K.sat);o.connect(w);w.connect(g);}else o.connect(g);
 if(K.clk&&!boom){const n=nz(t,.03),h=bq('highpass',2500),cg=env(out,t,v*.3,.012,.0005);n.connect(h);h.connect(cg);}
}
function dSnare(out,t,v,S,ghost){
 const k=ghost?.5:1;
 const o=osc('triangle',S.tf,t,S.td+.1),o2=osc('sine',S.tf*1.75,t,S.td+.1);
 const tg=env(out,t,v*S.tv,S.td*k,.001);o.connect(tg);o2.connect(tg);
 const n=nz(t,S.nd+.1),f=S.bp?bq('bandpass',S.bp,.7):bq('highpass',S.hp);
 const ng=env(out,t,v*S.nv,S.nd*k,.001);n.connect(f);f.connect(ng);
 if(S.bp){const h=bq('highpass',700);const n2=nz(t,S.nd);const g2=env(out,t,v*.25,S.nd*.8,.001);n2.connect(h);h.connect(g2);}
}
function dClap(out,t,v,Cf){
 for(let i=0;i<4;i++){
  const tt=t+i*.011,n=nz(tt,.25),b=bq('bandpass',Cf,1.1),g=env(out,tt,v*.75,i<3?.014:.17,.001);n.connect(b);b.connect(g);
 }
}
function dHat(out,t,v,H,open){
 const dec=open?H.odec:H.dec,g=env(out,t,v*(H.mt?.5:.6),dec,.0008),hp=bq('highpass',H.hp);hp.connect(g);
 if(H.mt){const b=bq('bandpass',H.bp*.9,.9);b.connect(hp);MET.forEach(f=>{const o=osc('square',f,t,dec+.05),og=ctx.createGain();og.gain.value=.22;o.connect(og);og.connect(b);});}
 else{const n=nz(t,dec+.05),b=bq('bandpass',H.bp,.8);n.connect(b);b.connect(hp);}
}
function dCrash(out,t,v,dec){
 const g=env(out,t,v*.5,dec,.002),hp=bq('highpass',4800);hp.connect(g);
 const n=nz(t,dec+.05);n.connect(hp);
 const b=bq('bandpass',9500,.7);b.connect(hp);MET.forEach(f=>{const o=osc('square',f*1.3,t,dec+.05),og=ctx.createGain();og.gain.value=.12;o.connect(og);og.connect(b);});
}
function dTom(out,t,v,f,dec){
 const o=osc('sine',f*1.5,t,dec+.08);o.frequency.exponentialRampToValueAtTime(f,t+.08);
 const g=env(out,t,v*.95,dec,.002);o.connect(g);
 const n=nz(t,.03),b=bq('bandpass',f*6,1),cg=env(out,t,v*.25,.02,.0005);n.connect(b);b.connect(cg);
}
function dRim(out,t,v,f){
 const o=osc('triangle',f,t,.06),o2=osc('square',f*.52,t,.06),g=env(out,t,v*.5,.03,.0005);o.connect(g);o2.connect(g);
 const n=nz(t,.03),h=bq('highpass',3000),ng=env(out,t,v*.3,.015,.0005);n.connect(h);h.connect(ng);
}
function dShake(out,t,v){const n=nz(t,.12),b=bq('bandpass',7000,1.4),g=env(out,t,v*.5,.06,.012);n.connect(b);b.connect(g);}
function dRiser(out,t,v){
 const n=nz(t,1.25),b=bq('bandpass',300,2.5);b.frequency.exponentialRampToValueAtTime(9000,t+1.15);
 const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v*.6,t+1.15);g.gain.linearRampToValueAtTime(.0001,t+1.22);
 n.connect(b);b.connect(g);g.connect(out);
}
function play(c,t,vel,vi){
 if(!ctx||!DB.ok)return;
 const out=DB.vg[vi],K=KITS[L.kit]||KITS['808'],v=Math.pow(vel/127,1.25)*((K.g&&K.g[c])||1);
 switch(c){
  case 'K':case 'D':case 'B':dKick(out,t,v,K.k,c);break;
  case 'S':dSnare(out,t,v,K.s,false);break;
  case 'g':dSnare(out,t,v,K.s,true);break;
  case 'P':dClap(out,t,v,K.clap);break;
  case 'H':dHat(out,t,v,K.h,false);break;
  case 'O':dHat(out,t,v,K.h,true);break;
  case 'C':dCrash(out,t,v,K.cr);break;
  case '1':dTom(out,t,v,K.t[0],K.td);break;
  case '2':dTom(out,t,v,K.t[1],K.td);break;
  case '3':dTom(out,t,v,K.t[2],K.td);break;
  case 'T':dTom(out,t,v,K.t[3],K.td*1.4);break;
  case 'r':dRim(out,t,v,K.rim);break;
  case 's':dShake(out,t,v);break;
  case 'Z':dRiser(out,t,v);break;
  default:break;
 }
}

  try{if(DB.vg[i])DB.vg[i].disconnect();if(DB.pan[i])DB.pan[i].disconnect();}catch(e){}

function fire(c,t,vi,vel){

function liveGen(){
 const D=L.D;if(!D)return;
 const r=liveNext(D);Q.steps=r.steps;Q.state=r.state;L.hist.push(r.steps);if(L.hist.length>64)L.hist.shift();
}
function stepAt(t,pos){
 let p=pos,hits=[];
 if(((p%16)+16)%16===0)DR.bar={t:t};
 if(p<0){
  const k=p+16;
  if((k&3)===0){fire('r',t,5,k===0?118:84);hits.push(5);}
  Q.pos=p+1;Q.evq.push({t:t,pos:p,hits:hits,txt:'COUNT '+((k>>2)+1)});
 }else{
  if(L.liveOn&&L.D){
   if(!Q.inLive){if(p%16===0){Q.inLive=true;p=0;liveGen();}}
   else{if(p>=16)p=0;if(p===0)liveGen();}
  }
  if(!(L.liveOn&&L.D&&Q.inLive)){
   if(p>=Q.steps.length)p=0;
   if(Q.pend&&p%16===0){Q.steps=Q.pend;Q.pend=null;p=0;}
   Q.inLive=false;
  }
  if(!Q.sentStart){Q.sentStart=true;if(L.clock)midiSend([0xFA],t);}
  const st=Q.steps[p]||'......';
  for(let v=0;v<6;v++){const c=st[v];if(c!=='.'){
   let vel=MAP[c].v;
   if(c==='H'&&p%4!==0)vel*=.78;
   fire(c,t,v,vel);hits.push(v);}}
  Q.pos=p+1;
  Q.evq.push({t:t,pos:p,hits:hits,txt:(L.liveOn&&Q.inLive)?Q.state:'BAR '+(((p/16)|0)+1)+'/'+Math.max(1,Math.round(Q.steps.length/16))});
 }
 const s=L.cur&&L.cur.swing?L.cur.swing/100*.5:0,sd=15/S.bpm;
 Q.next+=sd*((p&1)?(1-s):(1+s));
}
function tick(){
 if(!DR.on||!ctx)return;
 const h=ctx.currentTime+.14;
 while(Q.next<h)stepAt(Q.next,Q.pos);
 if(L.clock&&M.out){while(Q.clk<h){midiSend([0xF8],Q.clk);Q.clk+=15/S.bpm/6;}}else Q.clk=Q.next;
}

 Q.steps=L.steps.slice();
 if(L.liveOn){L.D=liveNew(L.gen.style,L.gen.energy,L.vi);L.hist=[];}
 clearInterval(Q.timer);Q.timer=setInterval(tick,25);tick();
 syncRun();
}
function stopSeq(){

function curKey(t){return t&&L.cur&&t.style===L.cur.style&&t.seed===L.cur.seed&&t.name===L.cur.name;}
function liveCapture(n){
 const h=L.hist.slice(-n);if(!h.length)return null;
 return {name:'LIVE '+(1000+Math.floor(Math.random()*9000)),style:L.gen.style,bpm:S.bpm,seed:0,energy:L.gen.energy,swing:(L.cur&&L.cur.swing)||0,fills:0,bars:h.length,extra:{},steps:[].concat(...h)};
}
function setLive(on){
 if(on===L.liveOn)return;
 L.liveOn=on;
 if(on){L.D=liveNew(L.gen.style,L.gen.energy,L.vi);L.hist=[];Q.state='GROOVE';msg('LIVE: endless drums. FILL / BUILD / BREAK / DROP / HOLD shape it.');}
 else{L.D=null;Q.inLive=false;if(DR.on)Q.pend=L.steps.slice();msg('LIVE off: back to the loaded track.');}
 syncLive();saveLab();
}
function liveTrig(k){
 if(recCtl)recCtl('mk:'+String(k).toUpperCase(),1);
 const D=L.D;if(!L.liveOn||!D){msg('Turn LIVE on first.');return;}
 if(k==='fill')D.fillN=true;
 else if(k==='build'){if(!D.build&&!D.dropN){D.build=4;D.brk=false;}}
 else if(k==='brk'){if(D.brk){D.brk=false;D.dropN=true;}else{D.brk=true;D.build=0;}}
 else if(k==='drop'){D.dropN=true;D.brk=false;D.build=0;}
 else if(k==='hold')D.hold=!D.hold;
 liveBtns();
}

/* ================= .MID EXPORT (Standard MIDI File, type 0, GM channel 10) ================= */
function vlq(n){const b=[n&127];while((n>>=7)>0)b.unshift((n&127)|128);return b;}
function buildMidi(tr,bpm){
 const steps=tr.steps||drumGen(tr).steps,PPQ=480,SD=PPQ/4,sw=(tr.swing||0)/100*.5;
 const ev=[];
 steps.forEach((st,i)=>{
  const tk=Math.round(i*SD+((i&1)?sw*SD:0));
  for(let v=0;v<6;v++){const c=st[v];if(c==='.')continue;const m=MAP[c];if(!m)continue;
   let vel=m.v;if(c==='H'&&i%4!==0)vel=Math.round(vel*.78);
   ev.push([tk,1,0x99,m.n,vel]);ev.push([tk+((c==='C'||c==='Z'||c==='B')?SD*2:Math.round(SD*.5)),0,0x89,m.n,0]);}
 });
 ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
 const tb=[];
 const us=Math.round(60000000/bpm);
 tb.push(0,0xFF,0x51,3,(us>>16)&255,(us>>8)&255,us&255);
 tb.push(0,0xFF,0x58,4,4,2,24,8);
 const nm=(tr.name||'Xeno Drums').slice(0,40);const nb=[...nm].map(c=>c.charCodeAt(0)&127);
 tb.push(0,0xFF,0x03,nb.length,...nb);
 let last=0;
 for(const e of ev){tb.push(...vlq(e[0]-last),e[2],e[3],e[4]);last=e[0];}
 tb.push(...vlq(Math.max(0,steps.length*SD-last)),0xFF,0x2F,0);
 const out=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,(PPQ>>8)&255,PPQ&255,0x4D,0x54,0x72,0x6B,(tb.length>>24)&255,(tb.length>>16)&255,(tb.length>>8)&255,tb.length&255,...tb];
 return new Uint8Array(out);
}
function exportMid(){
 try{
  const tr=L.liveOn?liveCapture(L.saveN):Object.assign({},L.cur);
  if(!tr){msg('Nothing played yet — start LIVE first.');return;}
  const bytes=buildMidi(tr,S.bpm);
  const nm=((tr.name||'track')+'').replace(/[^a-z0-9]+/gi,'_').slice(0,24);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'audio/midi'}));
  a.download='xeno_drums_'+tr.style+'_'+nm+'_'+Math.round(S.bpm)+'bpm.mid';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  msg('Exported '+a.download+' ('+Math.round(tr.steps?tr.steps.length/16:32)+' bars, GM drums ch10).');
 }catch(e){console.error(e);msg('Export failed: '+e.message);}
}

/* ================= PERSISTENCE ================= */
function saveLab(){try{localStorage.setItem('xenoDrums',JSON.stringify({vol:L.vol,ci:L.ci,ls2:L.lockSets,kit:L.kit,internal:L.internal,human:L.human,vols:L.vols,pans:L.pans,mutes:L.mutes,cat:L.cat,cur:L.cur,user:L.user,gen:L.gen,vi:L.vi,sn:L.saveN,midiOn:L.midiOn,ch:L.ch,clock:L.clock,lat:L.lat,out:L.outId}));}catch(e){}}
function loadLab(){
 try{const o=JSON.parse(localStorage.getItem('xenoDrums')||'null');if(o){
  if(typeof o.vol==='number')L.vol=Math.max(0,Math.min(1.2,o.vol));
  L.ci=o.ci!==false;L.lockSets=!!o.ls2;L.internal=o.internal!==false;L.midiOn=o.midiOn!==false;L.clock=!!o.clock;
  if(KITS[o.kit])L.kit=o.kit;
  if(typeof o.human==='number')L.human=Math.max(0,Math.min(1,o.human));
  ['vols','pans','mutes'].forEach(k=>{if(Array.isArray(o[k])&&o[k].length===6)L[k]=o[k].map(Number);});
  if(DRUM_PRE[o.cat]||o.cat==='mine')L.cat=o.cat;
  if(Array.isArray(o.user))L.user=o.user.filter(t=>t&&DRUM_STYLES[t.style]&&(Array.isArray(t.steps)||isFinite(t.seed)));
  if(o.gen)Object.assign(L.gen,o.gen);
  if(o.vi>=0&&o.vi<4)L.vi=o.vi|0;if([4,8,16,32].includes(o.sn))L.saveN=o.sn;
  if(o.ch>=1&&o.ch<=16)L.ch=o.ch|0;if(typeof o.lat==='number')L.lat=Math.max(-100,Math.min(100,o.lat));
  if(typeof o.out==='string')L.outId=o.out;
  if(o.cur&&DRUM_STYLES[o.cur.style]&&(Array.isArray(o.cur.steps)||isFinite(o.cur.seed)))L.cur=o.cur;
 }}catch(e){}
 if(!L.cur)L.cur=drumPremade('rock',0);
 L.steps=(L.cur.steps&&L.cur.steps.length)?L.cur.steps.slice():drumGen(L.cur).steps;
 Q.steps=L.steps.slice();
}


function mkBtns(parent,cls){const d=document.createElement('div');d.className='btns '+(cls||'');parent.appendChild(d);return d;}
function holdRepeat(b,fn){
 let t1=null,t2=null;const stop=()=>{clearTimeout(t1);clearInterval(t2);};
 b.addEventListener('pointerdown',e=>{e.preventDefault();fn();t1=setTimeout(()=>{t2=setInterval(fn,90);},450);});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
}
/* ================= STEP LEDS / METERS ================= */
function setPos(p,txt){
 const leds=UI.leds;if(!leds)return;
 let act=-1;
 if(p>=0)act=p%16;else if(p>-99)act=(p+16);
 for(let i=0;i<16;i++)leds[i].className='led'+(i%4===0?' q':'')+(i===act?(p<0?' ci':' a'):'');
 if(UI.pos)UI.pos.textContent=txt||'—';
}
function frame(){
 requestAnimationFrame(frame);
 if(ctx){
  const now=ctx.currentTime;
  while(Q.evq.length&&Q.evq[0].t<=now+.01){const e=Q.evq.shift();setPos(e.pos,e.txt);e.hits.forEach(v=>L.lv[v]=1);}
 }
 for(let i=0;i<6;i++){L.lv[i]*=.9;const m=UI.mt&&UI.mt[i];if(m)m.style.width=Math.round(L.lv[i]*100)+'%';}
 liveBtns();
}
function liveBtns(){
 const D=L.D,T=UI.trig;if(!T)return;
 T.fill.classList.toggle('on',!!(D&&D.fillN));
 T.build.classList.toggle('on',!!(D&&D.build>0));
 T.brk.classList.toggle('on',!!(D&&D.brk));
 T.drop.classList.toggle('on',!!(D&&D.dropN));
 T.hold.classList.toggle('on',!!(D&&D.hold));
}
function syncLive(){
 if(!UI.live)return;
 UI.live.classList.toggle('on',L.liveOn);
 UI.vbtn.forEach((b,i)=>b.classList.toggle('on',i===L.vi));
 ctl.forEach(f=>f());

function renderTracks(){

 UI.tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===L.cat));
 Ls.innerHTML='';

 if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='No saved tracks yet. Generate or go LIVE, then SAVE.';Ls.appendChild(e);return;}

setBpm(S.bpm);
applyTheme(themeIdx);
$('#vol').value=S.vol;
$('#vol').addEventListener('input',e=>{S.vol=+e.target.value;applyFx();save();});
$('#pPrev').addEventListener('click',()=>loadPreset(curP-1));
$('#pNext').addEventListener('click',()=>loadPreset(curP+1));
$('#pSel').addEventListener('change',e=>loadPreset(+e.target.value));
$('#btnTheme').addEventListener('click',()=>applyTheme(themeIdx+1));
$('#btnMode').addEventListener('click',()=>setPerf(!perfOn));
try{if(localStorage.getItem('xenoPerf')==='1')setPerf(true);}catch(e){}
$('#btnFull').addEventListener('click',goFull);
$('#btnPanic').addEventListener('click',panic);
$('#startBtn').addEventListener('click',()=>{
 initAudio();initMidi();wake();
 $('#start').style.display='none';
 try{goFull();}catch(e){}
});
arpTimer=setInterval(arpTick,25);
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
